<style>
html, body { width: 1200px; height: 628px; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f3f5f9; --surface: #ffffff; --ink: #14213d; --muted: #4f5b70; --line: #d5dceb;
  --navy: #1e3a6e; --navy-deep: #0f2348; --navy-mid: #2c5296; --sky: #dfe6f3; --sky2: #eef2f9;
  --green: #2f9e44; --green-text: #237a35; --green-light: #69db7c; --green-soft: #e3f6e7;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --bp: linear-gradient(rgba(30,58,110,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(30,58,110,.07) 1px, transparent 1px), linear-gradient(rgba(30,58,110,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(30,58,110,.035) 1px, transparent 1px);
  --bp-w: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
}
body { overflow: hidden; position: relative; color: #fff; font-family: var(--font); font-weight: 500; line-height: 1.85; -webkit-font-smoothing: antialiased;
  background: var(--navy); background-image: radial-gradient(ellipse at 75% 55%, rgba(80,130,220,.35), transparent 60%), linear-gradient(160deg, #22427c 0%, var(--navy) 45%, var(--navy-deep) 100%); }
.bpgrid { position: absolute; inset: 0; background-image: var(--bp-w); background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
.citymap { position: absolute; inset: 0; width: 100%; height: 100%; }
.citymap .st { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 1.4; }
.citymap .st.major { stroke: rgba(255,255,255,.28); stroke-width: 3; }
.citymap .st.river { stroke: rgba(130,180,255,.45); stroke-width: 2; }
.citymap .blk { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.14); stroke-width: 1; stroke-dasharray: 4 4; }
.citymap .dim { stroke: rgba(105,219,124,.7); stroke-width: 1.4; fill: none; }
.citymap text { fill: rgba(255,255,255,.5); font-family: var(--font); font-size: 13px; font-weight: 700; letter-spacing: .14em; }
.citymap .pin { fill: var(--green-light); }
.citymap .pulse { fill: none; stroke: var(--green-light); stroke-width: 2; opacity: .6; }

.logo { position: absolute; display: flex; align-items: center; font-weight: 900; color: #fff; white-space: nowrap; letter-spacing: .02em; }
.logo .ic { display: block; flex: none; background: #fff; border-radius: 8px; }
.logo .ic svg { display: block; width: 100%; height: 100%; }
.logo span { line-height: 1.2; }
.logo small { display: block; letter-spacing: .2em; color: var(--green-light); line-height: 1.1; font-weight: 700; }
.badge { position: absolute; font-weight: 700; color: var(--navy); background: var(--sky); border-radius: 4px; white-space: nowrap; display: inline-flex; align-items: center; line-height: 1.3; }
.badge::before { content: ""; width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--green); box-shadow: 0 0 0 calc(var(--dot) * .5) rgba(47,158,68,.25); }

.eyebrow { position: absolute; display: inline-flex; align-items: center; font-weight: 700; color: #fff; border: 1.5px solid rgba(255,255,255,.45); border-radius: 2px; background: rgba(255,255,255,.07); white-space: nowrap; line-height: 1.3; }
.eyebrow::before { content: ""; width: .32em; height: .32em; background: var(--green-light); transform: rotate(45deg); flex: none; }
h1 { position: absolute; font-weight: 900; line-height: 1.42; letter-spacing: .01em; white-space: nowrap; }
h1 .box { display: inline-block; background: #fff; color: var(--navy); padding: 0 .18em; margin: .08em 0; transform: skewX(-8deg); }
h1 .box > span { display: inline-block; transform: skewX(8deg); }
h1 .g { color: var(--green-light); }

.cta { position: absolute; display: inline-flex; align-items: center; justify-content: center; background: var(--green); color: #fff; font-weight: 900; border-radius: 4px; white-space: nowrap; line-height: 1.2; box-shadow: 0 14px 30px -10px rgba(10,40,20,.7); }
.cta .arr { display: inline-block; height: 3px; background: #fff; position: relative; flex: none; }
.cta .arr::after { content: ""; position: absolute; right: 0; top: 50%; width: var(--ah); height: var(--ah); border-top: 3px solid #fff; border-right: 3px solid #fff; transform: translateY(-50%) rotate(45deg); transform-origin: center; }

/* stage parts (LPのヒーローから流用) */
.fxk { position: absolute; filter: drop-shadow(0 16px 16px rgba(0,0,20,.4)); }
.fxk > svg { display: block; width: 100%; height: auto; overflow: visible; }
.tag-ex { display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--sky2); border: 1px solid var(--line); border-radius: 4px; padding: 0 7px; line-height: 1.8; vertical-align: middle; white-space: nowrap; }
.hall { position: absolute; width: 300px; height: 300px; }
.hall .ring { position: absolute; inset: 10px; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.45); }
.hall .ring2 { position: absolute; inset: 40px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,.05) 70%); border: 1px solid rgba(255,255,255,.3); }
.hall .bldg { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -122px 0 0 -110px; filter: drop-shadow(0 22px 22px rgba(0,0,20,.45)); overflow: visible; }
.hall .lbl { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; font-weight: 900; letter-spacing: .3em; color: var(--green-light); white-space: nowrap; line-height: 1.4; }
.hall svg.dims { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.hall .dims path { fill: none; stroke: rgba(105,219,124,.8); stroke-width: 1.4; }
.panel { position: absolute; width: 350px; height: 236px; background: #eaf0fa; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); color: var(--green); overflow: hidden; }
.panel::before { content: ""; position: absolute; inset: 0; background-image: var(--bp); background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px; }
.panel svg { position: absolute; left: 50%; bottom: 0; width: 82%; height: auto; transform: translateX(-50%); display: block; }
.panel-tag { position: absolute; left: 40px; top: 14px; font-size: 11px; font-weight: 900; letter-spacing: .2em; color: var(--navy); z-index: 2; line-height: 1.4; }
.badge-ai { position: absolute; background: var(--green); color: #fff; font-size: 12px; font-weight: 900; padding: 6px 12px; letter-spacing: .1em; clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%); line-height: 1.4; }

.chat { position: absolute; width: 410px; background: #fff; color: var(--ink); border-radius: 6px; box-shadow: 0 30px 60px -20px rgba(0,0,20,.6); overflow: hidden; }
.chat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--navy-deep); color: #fff; padding: 10px 16px; font-size: 13px; font-weight: 700; line-height: 1.6; }
.chat-top .dots { display: flex; gap: 5px; }
.chat-top .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.35); }
.chat-top .dots i:first-child { background: var(--green-light); }
.deep { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: var(--sky2); }
.deep-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 700; color: var(--muted); line-height: 1.5; }
.deep-row b { font-size: 20px; color: var(--navy); font-weight: 900; }
.deep-row b small { font-size: 13px; color: var(--muted); }
.segs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
.segs i { height: 8px; background: #d3dbea; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.segs i.on { background: var(--green); }
.seg-lbl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 4px; font-size: 10.5px; color: var(--muted); text-align: center; font-weight: 700; line-height: 1.6; }
.seg-lbl span.on { color: var(--green-text); }
.mock-chat { padding: 16px; display: grid; gap: 12px; align-content: start; }
.chat-row { display: grid; gap: 3px; max-width: 88%; }
.chat-row .who { font-size: 11.5px; color: var(--muted); font-weight: 700; line-height: 1.5; }
.chat-row p { padding: 10px 14px; border-radius: 4px 14px 14px 14px; font-size: 14px; line-height: 1.7; background: var(--sky); }
.chat-row.me { justify-self: end; text-align: right; }
.chat-row.me p { background: var(--navy); color: #fff; border-radius: 14px 4px 14px 14px; text-align: left; }
h1 { font-size: 58px; }
</style>
</head>

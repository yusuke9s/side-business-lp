<style>
:root {
  --sl: #3d5266; --sl-deep: #2a3a4a; --sl-2: #56697c; --sl-soft: #dde4ea; --sl-mist: #eef2f5;
  --gold: #9c6b2f; --gold-text: #7f5620; --gold-lt: #c9a46a; --gold-soft: #f1e7d6;
  --washi: #f6f3ec; --washi-2: #efeae0; --white: #fffdf9;
  --ink: #232e39; --muted: #535e69;
  --f-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --washi-tex: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .37 0 0 0 0 .28 0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 1200px; height: 628px; overflow: hidden; }
body { background: var(--washi); color: var(--ink); font-family: var(--f-body); }
p { margin: 0; }
.ad { position: relative; width: 1200px; height: 628px; overflow: hidden; background-color: var(--washi); background-image: var(--washi-tex); }
/* やわらかな光と、遠くの丘（LPヒーローと同じ） */
.light { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,244,222,.95) 0%, rgba(241,231,214,.5) 35%, transparent 68%); pointer-events: none; }
.hills { position: absolute; left: 0; bottom: 0; width: 100%; pointer-events: none; }
/* 細い金の二重罫 */
.frame { position: absolute; inset: var(--fi); border: 1px solid rgba(156,107,47,.35); pointer-events: none; }
.frame::before { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(156,107,47,.16); }

.logo { position: absolute; display: inline-flex; align-items: center; gap: .36em; color: var(--sl-deep); }
.logo svg { width: 1.6em; height: 1.6em; flex: none; }
.logo b { font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; line-height: 1; }
.badge { position: absolute; display: inline-flex; align-items: center; gap: .5em; font-weight: 700; color: var(--white); background: var(--sl); border-radius: 999px; white-space: nowrap; line-height: 1; letter-spacing: .04em; }
.badge::before { content: ""; width: .42em; height: .42em; border-radius: 50%; background: var(--gold-lt); }

h1 { position: absolute; margin: 0; font-family: var(--f-display); font-weight: 700; color: var(--sl-deep); letter-spacing: .04em; line-height: 1.5; white-space: nowrap; }
h1 .em { position: relative; }
h1 .em svg { position: absolute; left: 0; bottom: .02em; width: 100%; height: .2em; overflow: visible; }
h1 .em path { fill: none; stroke: var(--gold-lt); stroke-width: .11em; stroke-linecap: round; opacity: .8; }
.sub { position: absolute; display: flex; align-items: center; gap: .6em; font-weight: 500; color: var(--sl); letter-spacing: .12em; white-space: nowrap; }
.sub::before { content: ""; width: 1.6em; height: 1px; background: var(--gold); }

.cta { position: absolute; display: inline-flex; align-items: center; justify-content: center; gap: .6em; background: var(--sl); color: var(--white); font-weight: 700; letter-spacing: .06em; border-radius: 999px; white-space: nowrap; line-height: 1; box-shadow: 0 .3em .8em rgba(42,58,74,.22); }
.cta .arr { display: inline-block; width: 1.1em; height: 1.5px; background: var(--gold-lt); position: relative; }
.cta .arr::after { content: ""; position: absolute; right: 0; top: -.17em; width: .36em; height: .36em; border-top: 1.5px solid var(--gold-lt); border-right: 1.5px solid var(--gold-lt); transform: rotate(45deg); }

/* やることと期限（LPヒーローのカードと同じ作り。サイズは em で一括調整） */
.tl-card { position: absolute; z-index: 2; background: rgba(255,253,249,.94); border: 1px solid rgba(61,82,102,.16); border-radius: 1.2em; padding: 1.6em 1.6em 1.1em 1.4em; box-shadow: 0 2em 4em rgba(42,58,74,.12), 0 2px 0 rgba(255,255,255,.8) inset; }
.tl-card::before { content: ""; position: absolute; inset: .55em; border: 1px solid rgba(156,107,47,.22); border-radius: .8em; pointer-events: none; }
.tl-head { display: flex; justify-content: space-between; align-items: center; gap: .6em; }
.tl-head b { font-family: var(--f-display); font-size: 1.22em; color: var(--sl-deep); letter-spacing: .06em; }
.tag-ex { font-size: .72em; font-weight: 700; color: var(--gold-text); border: 1px solid var(--gold-lt); border-radius: 3px; padding: 0 .55em; background: var(--white); white-space: nowrap; line-height: 1.6; }
.tl { position: relative; margin-top: .8em; }
.tl-path { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.tl-path .base { fill: none; stroke: var(--sl-soft); stroke-width: .4em; stroke-linecap: round; }
.tl-path .line { fill: none; stroke: url(#tlgrad); stroke-width: .17em; stroke-linecap: round; }
.tl-today { position: relative; display: flex; align-items: center; gap: .8em; padding: .2em 0 .6em .25em; }
.tl-today .sun { position: relative; width: 2.3em; height: 2.3em; flex: none; border-radius: 50%; background: radial-gradient(circle, #fff7e6 0 30%, var(--gold-lt) 31% 46%, rgba(201,164,106,.25) 47% 100%); }
.tl-today .sun::after { content: ""; position: absolute; inset: -.7em; border-radius: 50%; background: radial-gradient(circle, rgba(201,164,106,.35), transparent 70%); }
.tl-today b { font-family: var(--f-display); font-size: 1.15em; color: var(--gold-text); line-height: 1.3; }
.tl-today small { display: block; font-size: .84em; color: var(--muted); line-height: 1.4; }
.ring { --s: 3em; position: relative; display: grid; place-items: center; width: var(--s); height: var(--s); flex: none; border-radius: 50%; color: var(--sl); background: radial-gradient(circle at 50% 36%, #fffdf9 0 50%, rgba(241,231,214,.55) 100%); border: 1px solid var(--gold-lt); margin-left: auto; }
.ring::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1px solid rgba(201,164,106,.3); }
.ring .ph { position: relative; width: 44%; height: 44%; display: block; }
.ring .ph [opacity] { fill: var(--gold-lt); opacity: .5; }
.tl ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .25em; }
.tl li { position: relative; display: grid; grid-template-columns: 5.4em minmax(0, 1fr) auto; gap: .2em .8em; align-items: baseline; padding: .72em .4em .72em 4em; border-radius: .7em; line-height: 1.6; }
.tl .node { position: absolute; left: var(--nx, .95em); top: 50%; width: 1.24em; height: 1.24em; margin-top: -.62em; border-radius: 50%; background: var(--white); border: 2px solid var(--sl-2); z-index: 1; }
.tl li:nth-child(even) .node { --nx: 1.8em; }
.tl li.done .node { background: var(--sl); border-color: var(--sl); }
.tl li.done .node::after { content: ""; position: absolute; left: 32%; top: 12%; width: 26%; height: 52%; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
.tl li.next .node { border-color: var(--gold); background: var(--gold-soft); }
.tl li.next .node::before { content: ""; position: absolute; inset: -.45em; border-radius: 50%; border: 1.5px solid rgba(201,164,106,.6); }
.tl .when { font-family: var(--f-display); font-weight: 700; color: var(--sl); font-size: 1.03em; white-space: nowrap; }
.tl .what { font-weight: 500; white-space: nowrap; }
.tl .st { font-size: .82em; color: var(--muted); white-space: nowrap; background: var(--sl-mist); border-radius: 999px; padding: .05em .8em; }
.tl li.done .st { background: var(--sl); color: #fff; }
.tl li.next { background: rgba(241,231,214,.55); }
.tl li.next .st { background: var(--gold-soft); color: var(--gold-text); font-weight: 700; border: 1px solid var(--gold-lt); }

.f3d { position: absolute; z-index: 3; filter: drop-shadow(0 14px 18px rgba(42,58,74,.16)); }
.f3d svg { width: 100%; height: auto; display: block; overflow: visible; }
.sprig { position: absolute; opacity: .9; }
.sprig svg { width: 100%; height: auto; display: block; }

.cta { left: 48px; top: 416px; font-size: 27px; padding: 24px 38px; }
</style>

<script>
(function () {
  function mk(t, a) { var e = document.createElementNS("http://www.w3.org/2000/svg", t); for (var k in a) e.setAttribute(k, a[k]); return e; }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  // LP（public/souzoku.html）と同じ、今日から各期限へゆるやかにつながる線
  function drawTimeline() {
    var tl = document.getElementById("tl"), svg = document.getElementById("tl-path");
    var b = tl.getBoundingClientRect();
    var pts = [document.querySelector(".tl-today .sun")].concat($$(".tl .node")).map(function (n) { var r = n.getBoundingClientRect(); return [r.left - b.left + r.width / 2, r.top - b.top + r.height / 2]; });
    var k = parseFloat(getComputedStyle(tl).fontSize);
    var d = "M" + pts[0][0] + " " + pts[0][1];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], c = pts[i], my = (a[1] + c[1]) / 2;
      d += " C" + (a[0] + (i % 2 ? k : -k)) + " " + my + " " + (c[0] + (i % 2 ? -k : k)) + " " + my + " " + c[0] + " " + c[1];
    }
    svg.appendChild(mk("path", { d: d, "class": "base" }));
    svg.appendChild(mk("path", { d: d, "class": "line" }));
  }
  document.fonts.ready.then(function () { requestAnimationFrame(function () { drawTimeline(); document.documentElement.setAttribute("data-ready", "1"); }); });
})();
</script>

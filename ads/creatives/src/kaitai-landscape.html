* { box-sizing: border-box; margin: 0; padding: 0; }

body { position: relative; background-color: var(--y); color: var(--k); font-family: var(--fb); font-weight: 700; -webkit-font-smoothing: antialiased;

.abs { position: absolute; }
.dims { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }

.tape { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(-45deg, var(--k) 0 18px, var(--y) 18px 36px); }
.tape.t { top: 0; border-bottom: 5px solid var(--k); }
.tape.b { bottom: 0; border-top: 5px solid var(--k); }
.logo { display: inline-flex; align-items: center; gap: .32em; font-family: var(--fd); font-weight: 400; letter-spacing: .02em; line-height: 1; white-space: nowrap; }
.logo svg { width: 1.5em; height: 1.5em; flex: none; }
.badge { display: inline-flex; align-items: center; gap: .5em; background: var(--k); color: var(--y); font-weight: 700; line-height: 1; padding: .42em .8em .42em .7em; border-radius: 3px; white-space: nowrap; }
.badge::before { content: ""; width: .45em; height: .45em; border-radius: 50%; background: var(--y); box-shadow: 0 0 0 .18em rgba(242,183,5,.25); }
.eyebrow { display: inline-flex; align-items: stretch; gap: .55em; background: #fff; border: 4px solid var(--k); box-shadow: 6px 6px 0 var(--k); line-height: 1.25; white-space: nowrap; }
.eyebrow span { padding: .3em .7em .3em 0; }
.eyebrow i { width: 1.25em; flex: none; background: repeating-linear-gradient(-45deg, var(--k) 0 7px, var(--y) 7px 14px); }
.h1 { font-family: var(--fd); font-weight: 400; line-height: 1.2; letter-spacing: .01em; }
.ln { display: block; width: fit-content; }
.ln + .ln { margin-top: .16em; }
.ln > span { display: block; background: var(--k); color: var(--y); padding: .06em .3em .14em; white-space: nowrap; }
.ln-w > span { background: #fff; color: var(--k); border: 6px solid var(--k); box-shadow: 12px 12px 0 var(--k); }
.ln-w em { font-style: normal; background: linear-gradient(transparent 62%, var(--y) 62%); }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: .45em; background: var(--k); color: var(--y); font-family: var(--fd); font-weight: 400; letter-spacing: .04em; line-height: 1; padding: .66em 1.1em; border: 4px solid var(--k); border-radius: 6px; box-shadow: 10px 10px 0 #fff; white-space: nowrap; }
.cta svg { width: 1em; height: 1em; }
.frame { position: absolute; border: 5px solid var(--k); box-shadow: 16px 16px 0 var(--k); transform: rotate(1.4deg); background: var(--k); }
.frame > svg { display: block; width: 100%; height: auto; }
.st { position: absolute; z-index: 3; filter: drop-shadow(6px 8px 0 rgba(29,31,34,.55)); }
.st svg { display: block; width: 100%; height: auto; overflow: visible; }
.ctape { position: absolute; z-index: 2; background: repeating-linear-gradient(-45deg, var(--k) 0 16px, var(--y) 16px 32px); border-block: 4px solid var(--k); box-shadow: 0 8px 0 rgba(0,0,0,.25); }
/* 見積書（表示例） */
.doc { position: absolute; z-index: 4; background: var(--paper); color: var(--k); border: 4px solid var(--k); box-shadow: 12px 12px 0 var(--k); padding: 1.1em 1em 1em; font-weight: 700;
  background-image: linear-gradient(rgba(29,31,34,.035) 1px, transparent 1px); background-size: 100% 1.6em; }
.doc-head { display: flex; align-items: baseline; justify-content: space-between; gap: .6em; border-bottom: 4px double var(--k); padding-bottom: .35em; }
.doc-head b { font-family: var(--fd); font-weight: 400; font-size: 1.5em; letter-spacing: .25em; line-height: 1.2; }
.doc-head span { font-size: .78em; border: 2px solid var(--red); color: var(--red); padding: 0 .5em; line-height: 1.5; }
.doc table { width: 100%; border-collapse: collapse; margin-top: .5em; font-variant-numeric: tabular-nums; line-height: 1.3; }
.doc th { background: var(--k); color: var(--y); font-size: .74em; padding: .35em .5em; text-align: left; }
.doc td { padding: .38em .5em; border-bottom: 1.5px dashed #b9b29c; white-space: nowrap; }
.doc td:last-child, .doc th:last-child { text-align: right; }
.doc .total td { border-bottom: 0; border-top: 3px solid var(--k); background: var(--y); }
.doc .total td:last-child { font-family: var(--fd); font-weight: 400; font-size: 1.2em; }
.doc .stamp { position: absolute; right: .7em; top: 3.4em; width: 4.2em; height: 4.2em; border: 3px solid var(--red); border-radius: 50%; color: var(--red); display: grid; place-items: center; font-size: .9em; transform: rotate(-14deg); background: rgba(214,51,43,.05); }
</style>
</head>

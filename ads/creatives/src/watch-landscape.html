<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>ページ見張り番 広告 landscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --ink: #0a1128; --ink2: #0f1938; --ink3: #16224a; --card: #1a2752; --line: rgba(150,175,255,.16);
  --rose: #c2255c; --rose-l: #ff7aa8; --rose-d: #8f1742; --sig: #3ee6a0; --txt: #eef2ff; --mut: #b2bddf;
  --fb: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --fm: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 628px; overflow: hidden; }
body { position: relative; color: var(--txt); font-family: var(--fb); font-weight: 500; -webkit-font-smoothing: antialiased; background: var(--ink); }
.bg { position: absolute; inset: 0; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(160,185,255,.16) 1.3px, transparent 2px); background-size: 30px 30px; }
.scanband { position: absolute; left: 0; right: 0; background: linear-gradient(transparent, rgba(62,230,160,.07), transparent); }
.abs { position: absolute; }
.logo { display: inline-flex; align-items: center; gap: .4em; font-weight: 900; letter-spacing: .04em; line-height: 1; white-space: nowrap; }
.logo svg { width: 1.6em; height: 1.6em; flex: none; }
.badge { display: inline-flex; align-items: center; gap: .5em; font-weight: 700; line-height: 1; color: var(--sig); border: 2px solid rgba(62,230,160,.6); padding: .45em .9em .45em .75em; border-radius: 999px; white-space: nowrap; background: rgba(62,230,160,.1); }
.badge::before { content: ""; width: .42em; height: .42em; border-radius: 50%; background: var(--sig); box-shadow: 0 0 0 .22em rgba(62,230,160,.22); }
.eyebrow { display: inline-flex; align-items: center; gap: .55em; font-weight: 700; line-height: 1.2; border: 1.5px solid var(--line); background: rgba(26,39,82,.75); padding: .32em .9em .32em .32em; border-radius: 999px; white-space: nowrap; }
.eyebrow b { font-family: var(--fm); font-weight: 600; font-size: .62em; letter-spacing: .14em; background: var(--rose); color: #fff; padding: .3em .9em; border-radius: 999px; }
.h1 { font-weight: 900; line-height: 1.3; letter-spacing: .01em; }
.h1 .l { display: block; white-space: nowrap; }
.mk { position: relative; z-index: 0; white-space: nowrap; }
.mk::before { content: ""; position: absolute; left: -.06em; right: -.06em; bottom: .06em; height: .36em; background: var(--rose); z-index: -1; }
.mk-g { color: var(--sig); }
.cta { display: inline-flex; align-items: center; justify-content: center; gap: .5em; background: var(--rose); color: #fff; font-weight: 900; letter-spacing: .04em; line-height: 1; padding: .72em 1.4em; border-radius: 999px; white-space: nowrap;
  box-shadow: 0 0 0 .22em rgba(255,122,168,.18), 0 .5em 1.4em rgba(194,37,92,.5); }
.cta svg { width: 1em; height: 1em; }
.stage { position: absolute; }
.radar { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: radial-gradient(circle, rgba(22,34,74,.97) 0%, rgba(13,22,50,.97) 70%); box-shadow: 0 0 0 2px rgba(150,175,255,.25), 0 0 120px rgba(194,37,92,.32), inset 0 0 80px rgba(0,0,0,.5); }
.radar svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; }
.sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg 270deg, rgba(255,122,168,.08) 290deg, rgba(255,122,168,.55) 358deg, rgba(255,200,222,1) 360deg); }
.blip { position: absolute; width: 2.2%; height: 2.2%; transform: translate(-50%, -50%); border-radius: 50%; background: var(--rose-l); }
.blip.hot { box-shadow: 0 0 0 6px rgba(255,122,168,.3), 0 0 22px 6px rgba(255,122,168,.6); }
.blip.dim { opacity: .35; }
.pg { position: absolute; width: 33%; transform: translate(-50%, -50%); z-index: 2; }
.pg svg { display: block; width: 100%; height: auto; border-radius: 6%; box-shadow: 0 14px 30px rgba(0,0,0,.5); }
.pg.hot svg { box-shadow: 0 0 0 4px var(--rose-l), 0 0 40px rgba(255,122,168,.7); }
.f3 { position: absolute; z-index: 3; height: auto; overflow: visible; filter: drop-shadow(0 12px 16px rgba(0,0,0,.45)); }
.scan-label { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--fm); letter-spacing: .2em; color: var(--rose-l); background: rgba(10,17,40,.85); padding: .2em .9em; border-radius: 999px; border: 1.5px solid rgba(255,122,168,.45); white-space: nowrap; line-height: 1.4; }
.scan-label::before { content: ""; display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: var(--rose-l); margin-right: .7em; vertical-align: .08em; }
/* 通知（表示例） */
.notif { position: absolute; z-index: 5; }
.notif .bell { position: absolute; z-index: 6; height: auto; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
.notice { background: #fff; color: #1b2140; border-radius: 1.1em; padding: .9em 1.05em 1em; box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.4); }
.notice-top { display: flex; align-items: center; gap: .5em; font-size: .82em; color: #59607a; line-height: 1.3; }
.notice-top b { color: #1b2140; font-weight: 900; }
.notice-top .app { width: 1.6em; height: 1.6em; border-radius: .4em; background: var(--rose); display: grid; place-items: center; flex: none; }
.notice-top .app svg { width: 70%; height: 70%; }
.notice-top span:last-child { margin-left: auto; font-family: var(--fm); }
.notice-title { font-weight: 900; margin-top: .45em; line-height: 1.45; }
.notice-diff { font-size: .9em; line-height: 1.5; margin-top: .4em; display: flex; gap: .45em; align-items: flex-start; font-weight: 700; }
.plus { flex: none; font-size: .78em; font-weight: 900; background: var(--sig); color: #053a26; border-radius: .3em; padding: .1em .45em; margin-top: .15em; }
.mock-note { font-size: .7em; color: var(--mut); margin-top: .5em; text-align: right; font-weight: 700; }
</style>
</head>

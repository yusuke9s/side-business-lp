<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>衛生管理者 合格ドリル 広告 landscape</title>
<!-- 広告クリエイティブ 1200x628。文言を直したら Playwright で 1200x628・deviceScaleFactor 1 で撮り直す（ads/creatives/eisei-landscape.png）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Yomogi&display=swap">
<style>
html, body { width: 1200px; height: 628px; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper: #fffaf2; --surface: #ffffff; --ink: #1d232b; --muted: #545e69; --line: #e6dccf;
  --brand: #d9480f; --brand-deep: #b33c0b; --brand-soft: #fde4d3;
  --green: #1f6b3a; --green-deep: #133f24; --green-soft: #d3f0dc; --green-bright: #2b8a3e;
  --hl: #ffe066; --note-y: #fff3a8;
  --font-display: "M PLUS 1p", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --grid: linear-gradient(rgba(217,72,15,.10) 1px, transparent 1px), linear-gradient(90deg, rgba(217,72,15,.10) 1px, transparent 1px), linear-gradient(rgba(217,72,15,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(217,72,15,.05) 1px, transparent 1px);
  --grid-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
}
body { overflow: hidden; position: relative; background: var(--paper); background-image: var(--grid); background-size: var(--grid-size); color: var(--ink); font-family: var(--font-body); line-height: 1.8; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
.glow { position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #ffb37f 0, #ff8a3d 35%, var(--brand) 70%); opacity: .16; }

/* logo / badge (LPのトップバーと同じ) */
.logo { position: absolute; display: flex; align-items: center; font-family: var(--font-display); font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
.logo svg { flex: none; display: block; }
.logo span { line-height: 1.15; }
.logo small { display: block; letter-spacing: .18em; color: var(--brand-deep); line-height: 1; }
.badge { position: absolute; font-weight: 700; color: #fff; background: var(--green); border-radius: 999px; white-space: nowrap; display: inline-flex; align-items: center; line-height: 1.3; }
.badge::before { content: ""; border-radius: 50%; background: var(--hl); }

/* copy */
.eyebrow { position: absolute; display: inline-flex; align-items: center; font-weight: 800; font-family: var(--font-display); background: var(--ink); color: #fff; border-radius: 10px; transform: rotate(-1.5deg); white-space: nowrap; line-height: 1.3; }
.eyebrow b { background: var(--brand); border-radius: 6px; letter-spacing: .08em; }
h1 { position: absolute; font-family: var(--font-display); font-weight: 800; line-height: 1.26; letter-spacing: -.01em; white-space: nowrap; }
h1 .o { color: var(--brand); }
.hl { background-image: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding: 0 .06em; }

.cta { position: absolute; display: inline-flex; align-items: center; justify-content: center; background: var(--brand); color: #fff; font-family: var(--font-display); font-weight: 800; border: 3px solid var(--ink); white-space: nowrap; line-height: 1.2; }
.cta .arr { display: inline-grid; place-items: center; border-radius: 50%; background: #fff; color: var(--brand); flex: none; }
.cta .arr svg { display: block; }

/* collage parts (LPのヒーローから流用) */
.blob { position: absolute; border-radius: 42% 58% 55% 45% / 50% 40% 60% 50%; background: var(--brand); background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 12px, transparent 12px 24px); border: 3px solid var(--ink); }
.fx { position: absolute; filter: drop-shadow(0 12px 14px rgba(60,30,10,.25)); }
.fx svg { display: block; width: 100%; height: auto; overflow: visible; }
.tag-ex { display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted); background: #f1ece4; border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; line-height: 1.8; vertical-align: middle; }

.tearcal { position: absolute; width: 158px; }
.tc-page { position: relative; background: #fff; border: 2.5px solid var(--ink); border-radius: 6px 6px 10px 10px; text-align: center; padding: 0 0 10px; box-shadow: 0 4px 0 #fff, 0 6px 0 var(--ink), 0 9px 0 #fff, 0 11px 0 var(--ink), 6px 16px 18px rgba(0,0,0,.18); }
.tc-head { background: var(--brand); color: #fff; font-weight: 800; font-size: 13px; padding: 14px 0 4px; border-bottom: 2.5px solid var(--ink); border-radius: 3px 3px 0 0; letter-spacing: .1em; }
.tc-num { display: block; font-family: var(--font-display); font-weight: 800; font-size: 66px; line-height: 1.05; margin-top: 4px; }
.tc-unit { font-weight: 800; font-size: 14px; }
.tc-foot { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.tc-rings { position: absolute; top: -10px; left: 0; right: 0; display: flex; justify-content: space-around; z-index: 3; }
.tc-rings i { width: 12px; height: 22px; border-radius: 6px; background: #3b3b3b; border: 2px solid var(--ink); box-shadow: inset 2px 0 0 #777; }

.qcard { position: absolute; width: 410px; }
.qc-face { background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; padding: 20px 22px; box-shadow: 10px 10px 0 var(--ink); }
.quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
.quiz-head .tag { background: var(--brand); color: #fff; padding: 2px 12px; border-radius: 999px; font-weight: 800; font-size: 12px; }
.quiz-head b { color: var(--ink); }
.quiz-q { margin-top: 12px; font-weight: 700; font-size: 15.5px; line-height: 1.7; }
.quiz-opts { margin: 12px 0 0; list-style: none; display: grid; gap: 6px; font-size: 14.5px; counter-reset: opt; }
.quiz-opts li { counter-increment: opt; display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 10px; padding: 5px 10px; background: #fffdf9; }
.quiz-opts li::before { content: counter(opt); display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink); font-size: 12px; font-weight: 800; }
.flip-btn { margin-top: 14px; width: 100%; font: inherit; font-weight: 800; font-size: 14.5px; color: #fff; background: var(--green); border: 2px solid var(--ink); border-radius: 10px; padding: 9px 12px; text-align: center; }

.ringcard { position: absolute; width: 184px; background: #fff; border: 2.5px solid var(--ink); border-radius: 18px; padding: 14px 14px 12px; box-shadow: 6px 6px 0 var(--green); text-align: center; }
.ring { position: relative; width: 120px; margin: 0 auto; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .trk { stroke: #f1e6da; }
.ring .bar { stroke: var(--brand); stroke-dasharray: 100; stroke-dashoffset: 40; }
.ring-num { position: absolute; inset: 0; display: grid; place-content: center; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; text-align: center; }
.ring-num small { font-size: 12px; color: var(--muted); margin-top: 4px; }
.ringcard p { font-weight: 800; font-size: 13.5px; margin-top: 6px; line-height: 1.6; }
.ringcard .tag-ex { margin-top: 4px; }
.badge::before { width: var(--dot); height: var(--dot); }
h1 { font-size: 60px; }
</style>
</head>

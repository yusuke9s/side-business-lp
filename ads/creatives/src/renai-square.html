<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>renai-square (1080x1080)</title>
<!-- 広告クリエイティブ 1080x1080。CSS・SVGは public/renai.html からそのまま流用。文言はこのファイルの本文で直して撮り直す -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* ===== LP (public/renai.html) のスタイルをそのまま ===== */

:root{
  --night:#0f0a26; --night2:#170f3a; --indigo:#251a5c; --purple:#862e9c; --violet:#c27ddb; --lav:#f3ebfa;
  --amber:#ffb547; --amber-l:#ffd690; --mint:#3ddcb0; --mint-d:#0ca678;
  --text:#f4effb; --muted:#c6bcdd; --ink:#1b1238; --ink-muted:#564c70;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);color:var(--text);background:var(--night);line-height:1.8;overflow-x:clip}
img,svg{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--f-disp);line-height:1.35;margin:0;font-weight:900;word-break:auto-phrase}
p{margin:0}
.wrap{width:min(1160px,100% - 32px);margin-inline:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;font-family:var(--f-disp);font-weight:900;font-size:1.1rem;text-decoration:none;color:var(--ink);
  background:linear-gradient(135deg,#ffc76a,#ffa63a);border:0;border-radius:999px;padding:.95em 1.9em;box-shadow:0 10px 30px rgba(255,170,60,.35),inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden;cursor:pointer}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
.btn svg{width:1.1em;height:1.1em;transition:transform .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(255,170,60,.5),inset 0 -3px 0 rgba(0,0,0,.12)}
.btn:hover svg{transform:translateX(4px)}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}

/* header */
.topbar{position:sticky;top:0;z-index:50;background:rgba(15,10,38,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--f-disp);font-weight:900;font-size:1.18rem;letter-spacing:.04em;white-space:nowrap}
.logo svg{width:36px;height:36px;flex:none}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--amber-l);border:1px solid rgba(255,181,71,.6);border-radius:999px;padding:3px 11px;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:blink 1.6s ease-in-out infinite}
.topbar .btn{margin-left:auto;font-size:.9rem;padding:.55em 1.3em}
@keyframes blink{50%{opacity:.25}}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#0a0620 0%,#160f3e 40%,#2c1a5e 70%,#5a2378 90%,#7a2b8e 100%);padding:56px 0 210px}
.stars{position:absolute;inset:0;width:100%;height:100%;fill:#fff}
.st{animation:tw 3s ease-in-out infinite}.st2{animation-duration:4.4s;animation-delay:-1.2s}.st3{animation-duration:2.4s;animation-delay:-2s}
.moon{position:absolute;right:max(16px,calc((100% - 1160px) / 2 - 116px));top:96px;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 64% 62%,rgba(214,170,90,.35) 0 9%,transparent 10%),radial-gradient(circle at 34% 70%,rgba(214,170,90,.3) 0 6%,transparent 7%),radial-gradient(circle at 38% 34%,#fffbea,#ffe7a8 60%,#f3c870);
  box-shadow:0 0 40px 8px rgba(255,214,130,.35),0 0 140px 50px rgba(255,170,90,.14)}
.shoot{position:absolute;left:20%;top:90px;width:140px;height:2px;background:linear-gradient(90deg,transparent,#fff);border-radius:2px;opacity:0;transform:rotate(-18deg)}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:300px}
.tw{animation:tw 3.2s ease-in-out infinite}.tw2{animation-duration:4.6s;animation-delay:-1.4s}.tw3{animation-duration:2.6s;animation-delay:-.6s}.tw4{animation-duration:6s;animation-delay:-3s}
.beacon{animation:blink 1.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.hero-glow{position:absolute;width:640px;height:640px;right:2%;top:40px;border-radius:50%;background:radial-gradient(circle,rgba(194,125,219,.38),rgba(134,46,156,.12) 45%,transparent 70%);pointer-events:none}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);grid-template-areas:"head stage" "body stage";column-gap:48px;align-items:center}
.hero-head{grid-area:head;align-self:end}.hero-body{grid-area:body;align-self:start}.hero-stage{grid-area:stage}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:.98rem;color:var(--amber-l);margin-bottom:20px}
.eyebrow::before{content:"";width:34px;height:2px;background:var(--amber)}
.hero h1{font-size:clamp(2.1rem,4.2vw,3.4rem)}
.hero h1 .band{display:inline-block;position:relative;color:var(--ink);padding:.04em .3em .1em;z-index:0;white-space:nowrap}
.hero h1 .band::before{content:"";position:absolute;inset:0;background:var(--amber);z-index:-1;transform:skewX(-8deg);box-shadow:8px 8px 0 rgba(134,46,156,.8)}
.hero h1 .l2{display:block;margin-top:.3em;font-size:.8em}
.hero h1 .grad{background:linear-gradient(90deg,var(--mint),#a5f3dc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:1.02rem;color:var(--muted);margin-top:24px;max-width:33em}
.chips{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:22px 0 0}
.chips li{display:flex;align-items:center;gap:7px;font-size:.86rem;font-weight:500;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);border-radius:999px;padding:5px 14px}
.chips li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-top:30px}
.cta-note{font-size:.84rem;color:var(--muted)}

/* phone */
.hero-stage{position:relative;padding:10px 0}
.phone{position:relative;z-index:2;width:340px;max-width:100%;margin:0 auto;background:linear-gradient(145deg,#2b2350,#0c0920);border-radius:48px;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.12),0 0 60px rgba(194,125,219,.35)}
.phone::before{content:"";position:absolute;left:50%;top:20px;width:92px;height:24px;margin-left:-46px;background:#07050f;border-radius:14px;z-index:3}
.screen{position:relative;background:#f2f0f8;border-radius:37px;overflow:hidden;color:var(--ink);font-size:13px;line-height:1.6;min-height:600px;display:flex;flex-direction:column}
.app-bar{display:flex;align-items:center;gap:9px;padding:52px 16px 12px;background:#fff;border-bottom:1px solid #e6e2f0}
.app-bar .back{font-size:1.4rem;line-height:1;color:var(--purple)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ffc2d1,#c9a7ff);display:grid;place-items:center;font-weight:700;color:#fff;font-size:.8rem}
.app-bar b{font-size:.92rem}
.app-bar .ex{margin-left:auto;font-size:.66rem;font-weight:700;color:var(--purple);border:1px solid var(--purple);border-radius:6px;padding:0 6px}
.chat{flex:1;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font-size:.68rem;color:#7a7192;background:#e4e0ef;border-radius:999px;padding:0 10px}
.slot{display:grid}.slot>*{grid-area:1/1}
.msg{max-width:84%;background:#fff;border-radius:4px 18px 18px 18px;padding:9px 13px;box-shadow:0 2px 6px rgba(27,18,56,.08);justify-self:start}
.msg small{display:block;font-size:.62rem;color:#9a91b0;margin-top:2px}
.typing{display:none;align-items:center;gap:4px;justify-self:start;align-self:start;background:#fff;border-radius:4px 18px 18px 18px;padding:12px 14px;box-shadow:0 2px 6px rgba(27,18,56,.08)}
.typing i{width:7px;height:7px;border-radius:50%;background:#a99fc4;animation:dot 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.js .typing.on{display:inline-flex}
.ai{background:linear-gradient(160deg,#2a1c5e,#4a2276);color:#fff;border-radius:18px;padding:12px 12px 12px;box-shadow:0 10px 24px rgba(42,28,94,.35)}
.ai-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.82rem;margin-bottom:8px}
.ai-badge{display:inline-flex;align-items:center;gap:4px;background:var(--mint);color:#0b2b22;font-size:.66rem;font-weight:900;border-radius:999px;padding:1px 8px}
.ai .typing{background:rgba(255,255,255,.14);box-shadow:none;padding:7px 10px;border-radius:999px;margin-left:auto}
.ai .typing i{background:#fff}
.sugs{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.sugs li{background:#fff;color:var(--ink);border-radius:12px;padding:7px 10px;font-size:.78rem;line-height:1.55;position:relative;border-left:4px solid var(--amber)}
.sugs li:nth-child(2){border-left-color:var(--mint-d)}.sugs li:nth-child(3){border-left-color:var(--violet)}
.sugs li b{display:block;font-size:.66rem;color:var(--purple);letter-spacing:.06em}
.tip{margin-top:9px;font-size:.72rem;color:#e7dcf7;display:flex;gap:6px;line-height:1.5}
.tip::before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;background:var(--amber);color:var(--ink);font-weight:900;font-size:.66rem;display:grid;place-items:center;margin-top:1px}
.inputbar{display:flex;align-items:center;gap:8px;padding:10px 12px 18px;background:#fff;border-top:1px solid #e6e2f0}
.inputbar span{flex:1;background:#f2f0f8;border-radius:999px;padding:6px 12px;color:#9a91b0;font-size:.74rem}
.inputbar i{width:28px;height:28px;border-radius:50%;background:var(--purple);display:grid;place-items:center}
.inputbar i::after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
.js .seq{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .55s cubic-bezier(.2,.9,.3,1.25)}
.js .sugs li.seq{transform:translateX(34px)}
.js .seq.on,.js .sugs li.seq.on{opacity:1;transform:none}
.flo{position:absolute;z-index:3;height:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.flo-bal{width:104px;left:-34px;top:70px}
.flo-cof{width:92px;left:-20px;bottom:40px}
.flo-bou{width:108px;right:-30px;top:44%}
.js .flo{animation:pop .8s cubic-bezier(.3,1.5,.5,1) both,float 6s ease-in-out infinite;animation-delay:var(--d,0s),calc(var(--d,0s) + .8s)}
.js .flo-cof{animation-duration:.8s,7s}.js .flo-bou{animation-duration:.8s,6.6s}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes pop{from{opacity:0;scale:.4}}
/* neon-tube icon frames */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.nic{display:inline-block;flex:none;line-height:0;position:relative;--core:color-mix(in srgb,var(--nc) 30%,#fff)}
.nic svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 2px var(--nc)) drop-shadow(0 0 7px color-mix(in srgb,var(--nc) 70%,transparent))}
.n-g{fill:none;stroke:var(--nc);stroke-width:6;opacity:.22}
.n-t{fill:rgba(255,255,255,.035);stroke:var(--core);stroke-width:1.7;stroke-dasharray:46 4;stroke-dashoffset:-30;stroke-linecap:round}
.n-i{fill:var(--core)}
.nic.tile{background:linear-gradient(160deg,#2a1c5e,#150e36);border-radius:28%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.nic.tile .n-g,.nic.tile .n-t{display:none}
.nic.tile svg{filter:drop-shadow(0 0 1.5px var(--nc)) drop-shadow(0 0 4px var(--nc))}
.js .nic svg{opacity:.18}
.js .in .nic svg,.js .rv.in .nic svg{opacity:1;animation:neonOn 1.1s linear var(--nd,.35s) both,flick 9s ease-in-out calc(var(--nd,.35s) + 2.5s) infinite}
@keyframes neonOn{0%{opacity:.18}12%{opacity:1}18%{opacity:.3}30%{opacity:1}36%{opacity:.45}48%,100%{opacity:1}}
@keyframes flick{0%,88%,100%{opacity:1}90%{opacity:.4}91%{opacity:1}93%{opacity:.55}94%{opacity:1}}
.scene:hover .nic svg,.notif:hover .nic svg{filter:drop-shadow(0 0 3px var(--nc)) drop-shadow(0 0 12px var(--nc))}
/* hand-drawn floating objects */
.flo .steam path{stroke-dasharray:4 6}
.js .flo .steam path{animation:steam 2.4s linear infinite}
.js .flo .steam path:nth-child(2){animation-delay:-.8s}.js .flo .steam path:nth-child(3){animation-delay:-1.6s}
@keyframes steam{to{stroke-dashoffset:-20}}
.js .flo .tdot{animation:dot 1.1s ease-in-out infinite}
.js .flo .tdot:nth-child(2){animation-delay:.15s}.js .flo .tdot:nth-child(3){animation-delay:.3s}
.js .gift .spk{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.js .gift .spk:nth-of-type(2){animation-delay:-1s}.js .gift .spk:nth-of-type(3){animation-delay:-1.8s}
.js .ent{animation:entUp .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.js .phone{animation:phoneIn 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
.js .hero h1 .band::before{animation:bandIn .7s .5s cubic-bezier(.7,0,.2,1) both;transform-origin:left}
.js .shoot{animation:shoot 9s 3s linear infinite}
.js .moon{animation:glow 6s ease-in-out infinite}
@keyframes entUp{from{opacity:0;translate:0 30px}}
@keyframes phoneIn{from{opacity:0;translate:0 70px;rotate:6deg}}
@keyframes bandIn{from{transform:skewX(-8deg) scaleX(0)}to{transform:skewX(-8deg) scaleX(1)}}
@keyframes shoot{0%{opacity:0;translate:0 0}2%{opacity:1}8%{opacity:0;translate:340px 110px}100%{opacity:0;translate:340px 110px}}
@keyframes glow{50%{box-shadow:0 0 56px 14px rgba(255,214,130,.45),0 0 160px 60px rgba(255,170,90,.18)}}

/* marquee */
.marq{position:relative;z-index:3;background:var(--purple);border-block:1px solid rgba(255,255,255,.18);overflow:hidden;white-space:nowrap}
.marq .track{display:inline-flex;animation:marq 38s linear infinite;font-family:var(--f-disp);font-weight:700;font-size:1.12rem;padding:14px 0}
.marq .track span{display:inline-flex;align-items:center;gap:1.1em;padding-right:1.1em}
.marq .track span::after{content:"";width:8px;height:8px;background:var(--amber);transform:rotate(45deg)}
.marq.out{background:transparent;border:0}
.marq.out .track{animation-direction:reverse;animation-duration:52s;font-size:2.2rem;font-weight:900;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.28);padding:16px 0}
.marq.out .track span::after{background:rgba(255,255,255,.2)}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
.sec{position:relative;padding:100px 0;overflow:hidden}
.sec-head{text-align:center;margin-bottom:54px}
.kicker{display:inline-block;font-family:var(--f-disp);font-weight:900;letter-spacing:.24em;font-size:.82rem;color:var(--amber);margin-bottom:10px}
.sec-title{font-size:clamp(1.7rem,3.3vw,2.5rem)}
.sec-title .hl{position:relative;display:inline-block;z-index:0;color:var(--ink);padding:0 .25em}
.sec-title .hl::before{content:"";position:absolute;inset:.06em 0;background:var(--amber);z-index:-1;transform:skewX(-8deg)}
.js .sec-head .hl::before{transform:skewX(-8deg) scaleX(0);transform-origin:left;transition:transform .8s .25s cubic-bezier(.7,0,.2,1)}
.js .sec-head.in .hl::before{transform:skewX(-8deg) scaleX(1)}
.sec-lead{color:var(--muted);margin-top:16px}
.js .rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv.rv-l{transform:translateX(-46px)}.js .rv.rv-r{transform:translateX(46px)}
.js .rv.rv-wipe{transform:none;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1),opacity .3s;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
.js .rv.rv-wipe.in{clip-path:inset(-10% -10% -10% -10%)}
.js .draw .dl{stroke-dasharray:1;stroke-dashoffset:1}
.js .draw.in .dl{stroke-dashoffset:0;transition:stroke-dashoffset 2.4s cubic-bezier(.6,.1,.3,1);transition-delay:var(--dd,.2s)}
.grid-bg{background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px}

/* pains */
.pains{background:var(--night)}
.notifs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;list-style:none;padding:0;margin:0}
.notif{position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:18px 20px 22px;backdrop-filter:blur(6px);transition:transform .3s,background .3s}
.notif:hover{transform:translateY(-6px);background:rgba(255,255,255,.11)}
.notif .nh{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--muted);margin-bottom:12px}
.notif .nh .nic{width:32px;height:32px}
.notif .nh time{margin-left:auto}
.notif p{font-family:var(--f-disp);font-weight:700;font-size:1.12rem;line-height:1.6}
.notif .dot{position:absolute;right:16px;top:-6px;width:14px;height:14px;border-radius:50%;background:#ff6b8b;box-shadow:0 0 12px #ff6b8b}
.js .notif .dot{animation:blink 1.8s ease-in-out infinite}
.notif:nth-child(2){margin-top:28px}.notif:nth-child(3){margin-top:56px}
.answer{text-align:center;margin-top:70px}
.answer p{display:inline-block;font-family:var(--f-disp);font-weight:900;font-size:clamp(1.25rem,2.6vw,1.8rem);line-height:1.6}
.answer p b{color:var(--amber)}

/* features */
.feat{background:linear-gradient(180deg,var(--night) 0,#1a1145 100%)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.fcard{background:#fff;color:var(--ink);border-radius:24px;overflow:hidden;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .35s;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.fcard:hover{transform:translateY(-10px) rotate(-1deg);box-shadow:0 26px 50px rgba(0,0,0,.45),0 0 0 3px var(--amber)}
.fcard:nth-child(even):hover{transform:translateY(-10px) rotate(1deg)}
.fvis{position:relative;aspect-ratio:4/3.3;background:var(--lav);color:var(--purple);display:grid;place-items:center;padding:18px;overflow:hidden}
.fcard:nth-child(2) .fvis{background:#e9f8f3}
.fcard:nth-child(3) .fvis{background:#fff3df}
.fcard:nth-child(4) .fvis{background:#e8e6f7}
.fvis .ud{width:100%;height:100%;transition:transform .5s}
.fcard:hover .fvis .ud{transform:scale(1.05)}
.fvis .no{position:absolute;left:14px;top:8px;font-family:var(--f-disp);font-weight:900;font-size:2rem;color:var(--purple);opacity:.9}
.fbody{padding:18px 20px 24px}
.fbody h3{font-size:1.16rem}
.fbody p{font-size:.9rem;color:var(--ink-muted);margin-top:8px;line-height:1.7}

/* map */
.mapsec{background:#120c2e}
.map-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:44px;align-items:center}
.map{position:relative;border-radius:26px;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.1)}
.map>svg{width:100%;height:auto;border-radius:26px}
.route-dots{fill:none;stroke:var(--amber);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 13}
.pin{transform-box:fill-box;transform-origin:50% 100%}
.js .map .pin{opacity:0;transform:scale(0) translateY(-10px);transition:opacity .4s,transform .6s cubic-bezier(.3,1.7,.5,1);transition-delay:var(--pd,0s)}
.js .map.in .pin{opacity:1;transform:none}
.pin-lab{position:absolute;transform:translate(-50%,calc(-100% - 46px));display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border-radius:14px;padding:6px 12px 6px 8px;box-shadow:0 10px 24px rgba(0,0,0,.35);white-space:nowrap;line-height:1.3}
.pin-lab::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.pin-lab .nic{width:32px;height:32px}
.pin-lab b{display:block;font-size:.88rem}
.pin-lab small{display:block;font-size:.7rem;color:var(--ink-muted)}
.js .map .pin-lab{opacity:0;translate:0 10px;transition:opacity .4s,translate .5s;transition-delay:calc(var(--pd,0s) + .15s)}
.js .map.in .pin-lab{opacity:1;translate:0 0}
.map .ex{position:absolute;right:14px;bottom:12px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.9);color:var(--ink);border-radius:6px;padding:0 8px}
.scenes{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:sc}
.scene{display:grid;grid-template-columns:52px 1fr;gap:4px 16px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px 18px;transition:background .3s,transform .3s}
.scene:hover{background:rgba(255,255,255,.1);transform:translateX(6px)}
.scene .nic{width:52px;height:52px;grid-row:span 2}
.scene b{font-family:var(--f-disp);font-size:1.08rem}
.scene b em{font-style:normal;color:var(--amber);margin-right:8px;font-size:.9rem}
.scene span{font-size:.88rem;color:var(--muted);line-height:1.6}

/* respect band */
.respect{background:var(--lav);color:var(--ink);padding:70px 0;overflow:hidden;position:relative}
.respect .wrap{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center}
.respect svg.ring{width:120px;height:120px}
.respect blockquote{margin:0;font-family:var(--f-disp);font-weight:900;font-size:clamp(1.25rem,2.6vw,1.9rem);line-height:1.6}
.respect blockquote em{font-style:normal;background:linear-gradient(transparent 62%,#e3c6f0 62%)}
.respect p{margin-top:10px;color:var(--ink-muted);font-size:.94rem}

/* steps */
.steps{background:linear-gradient(180deg,#160f3a,#1d1248)}
.flow{position:relative}
.flow-line{position:absolute;left:0;right:0;top:56px;width:100%;height:20px;overflow:visible}
.flow-line path{fill:none;stroke:url(#lg);stroke-width:3}
.flow-list{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;list-style:none;margin:0;padding:0}
.step{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:28px 24px 28px;text-align:center}
.step-ic{width:112px;height:112px;margin:-4px auto 0;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(194,125,219,.16),transparent 70%)}
.step-ic .nic{width:100%;height:100%}
.step-ic .n-t{stroke-width:1.4}
.step-ic .n-i{transform-box:fill-box;transform-origin:center}
.js .step-ic .n-i{animation:float 5s ease-in-out infinite;animation-delay:var(--b,0s)}
.step .n{display:block;font-family:var(--f-disp);font-weight:900;font-size:.85rem;letter-spacing:.2em;color:var(--amber);margin-top:16px}
.step h3{font-size:1.15rem;margin-top:6px}
.js .flow .step{opacity:0;transform:translateY(30px);transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.3,1.2)}
.js .flow.in .step{opacity:1;transform:none}
.js .flow.in .step:nth-child(2){transition-delay:.7s}.js .flow.in .step:nth-child(3){transition-delay:1.4s}

/* price */
.price{background:radial-gradient(ellipse at 50% 30%,#3b1d6b 0,#1d1248 55%,#120c2e 100%)}
.price-card{position:relative;max-width:640px;margin:0 auto;text-align:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:30px;padding:44px 30px 36px;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.price-card .lbl{display:inline-block;font-weight:700;font-size:.95rem;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 16px}
.price-card .amt{font-family:var(--f-disp);font-weight:900;font-size:clamp(3.4rem,8vw,5rem);line-height:1.1;margin-top:10px;color:#fff}
.price-card .amt small{font-size:.32em;margin-left:4px}
.price-card .note{color:var(--muted);font-size:.9rem;margin-top:4px}
.ticket{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;text-align:left;margin-top:30px;background:linear-gradient(135deg,#ffc76a,#ffa63a);color:var(--ink);border-radius:18px;padding:18px 22px}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:#2a1757}
.ticket::before{left:-12px}.ticket::after{right:-12px}
.ticket .big{font-family:var(--f-disp);font-weight:900;font-size:1.6rem;line-height:1.1;border-right:2px dashed rgba(27,18,56,.5);padding-right:18px}
.ticket .big small{display:block;font-size:.72rem;letter-spacing:.1em}
.ticket p{font-weight:700;font-size:.95rem}
.price-card .gift{position:absolute;width:92px;height:auto;right:-26px;top:-40px;rotate:10deg;overflow:visible;filter:drop-shadow(0 12px 14px rgba(0,0,0,.4))}
.js .price-card .gift{animation:float 5s ease-in-out infinite}

/* faq */
.faq{background:#120c2e}
.faq-list{max-width:820px;margin:0 auto;display:grid;gap:14px}
.faq details{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;transition:background .3s}
.faq details[open]{background:rgba(255,255,255,.1);border-color:rgba(255,181,71,.5)}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 20px;font-family:var(--f-disp);font-weight:700;font-size:1.06rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary .q{flex:none;width:32px;height:32px;border-radius:50%;background:var(--amber);color:var(--ink);display:grid;place-items:center;font-weight:900}
.faq summary .pm{margin-left:auto;flex:none;width:20px;height:20px;position:relative}
.faq summary .pm::before,.faq summary .pm::after{content:"";position:absolute;left:0;top:9px;width:20px;height:2px;background:#fff;transition:transform .3s}
.faq summary .pm::after{transform:rotate(90deg)}
.faq details[open] .pm::after{transform:rotate(0)}
.faq details p{padding:0 20px 20px 66px;color:var(--muted)}

/* signup */
.signup{background:linear-gradient(180deg,#120c2e 0,#22155a 45%,#4b2072 100%);padding-bottom:240px}
.signup .skyline{height:220px;opacity:.95}
.signup-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.signup .lead{color:var(--muted);margin-top:16px}
.signup-vis{position:relative;margin-top:30px;max-width:420px;color:var(--violet)}
.signup-vis .disc{position:absolute;left:8%;top:-4%;width:76%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6dd,#f3d9a0 70%);box-shadow:0 0 60px 10px rgba(255,214,130,.25)}
.signup-vis .ud{position:relative;width:100%;height:auto}
.signup-vis .ex{position:absolute;right:0;bottom:-4px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.9);color:var(--ink);border-radius:6px;padding:0 8px}
.form-card{background:#fff;color:var(--ink);border-radius:26px;padding:32px 28px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.form-card .perk-mini{display:flex;gap:10px;align-items:center;background:#fff4df;border-radius:12px;padding:10px 12px;font-size:.86rem;font-weight:700;margin-bottom:18px}
.form-card .perk-mini .nic{width:36px;height:36px}
.form-card label{display:block;font-weight:700;font-size:.95rem;margin-bottom:16px}
.form-card input,.form-card select{display:block;width:100%;margin-top:6px;font:inherit;font-weight:400;font-size:1rem;padding:12px 14px;border:1.5px solid #cfc6e2;border-radius:12px;background:#f8f5fc;color:var(--ink)}
.form-card input:focus,.form-card select:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 3px rgba(134,46,156,.2)}
.form-card .btn{width:100%;margin-top:6px}
.err{color:#b3261e;font-weight:700;font-size:.9rem;margin:0 0 10px}
.privacy{font-size:.8rem;color:var(--ink-muted);margin-top:14px}
.thanks{background:#fff;color:var(--ink);border-radius:26px;padding:34px 28px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.thanks h3{font-size:1.4rem;color:var(--purple)}
.thanks p{margin-top:10px}
.thanks small{display:block;margin-top:12px;color:var(--ink-muted)}

footer{background:#07051a;color:var(--muted);padding:40px 0 48px;font-size:.88rem;border-top:1px solid rgba(255,255,255,.08)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
footer .logo{color:#fff}
.sticky-cta{display:none}

@media (max-width:1000px){
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-grid{column-gap:28px;grid-template-columns:minmax(0,1fr) minmax(0,380px)}
}
@media (max-width:760px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .topbar .wrap{height:56px}
  .topbar .btn{display:none}
  .badge{margin-left:auto}
  .logo{font-size:1.02rem}.logo svg{width:30px;height:30px}
  .hero{padding:30px 0 150px}
  .hero-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "stage" "body"}
  .eyebrow{font-size:.86rem;margin-bottom:14px}
  .hero h1{font-size:clamp(1.85rem,8.6vw,2.3rem)}
  .hero h1 .l2{font-size:.74em}
  .moon{width:60px;height:60px;right:16px;top:18px}
  .hero-glow{width:420px;height:420px;right:-60px;top:200px}
  .hero-stage{margin-top:26px;padding:0 34px}
  .phone{width:290px;border-radius:42px;padding:10px}
  .screen{min-height:0;border-radius:33px;font-size:12.5px}
  .app-bar{padding-top:46px}
  .flo-bal{width:72px;left:-10px;top:30px}
  .flo-cof{width:64px;left:-6px;bottom:20px}
  .flo-bou{width:74px;right:-10px;top:52%}
  .skyline{height:180px}
  .cta-row .btn{width:100%}
  .marq .track{font-size:1rem;padding:11px 0}
  .marq.out .track{font-size:1.5rem}
  .sec{padding:76px 0}
  .sec-head{margin-bottom:38px}
  .sec-title{font-size:clamp(1.4rem,6.3vw,1.8rem)}
  .notifs{grid-template-columns:minmax(0,1fr);gap:16px}
  .notif:nth-child(n){margin-top:0}
  .notif:nth-child(2){margin-left:18px}.notif:nth-child(3){margin-left:36px}
  .fgrid{grid-template-columns:minmax(0,1fr);gap:20px}
  .fcard{display:grid;grid-template-columns:minmax(0,1fr)}
  .fvis{aspect-ratio:16/10}
  .map-grid,.signup-grid{grid-template-columns:minmax(0,1fr);gap:30px}
  .pin-lab{padding:4px 8px 4px 5px;gap:5px;border-radius:10px;transform:translate(-50%,calc(-100% - 30px))}
  .pin-lab .nic{width:24px;height:24px}
  .pin-lab b{font-size:.72rem}
  .pin-lab small{display:none}
  .respect{padding:56px 0}
  .respect .wrap{grid-template-columns:minmax(0,1fr);gap:18px;text-align:center}
  .respect svg.ring{width:84px;height:84px;margin:0 auto}
  .flow-line{display:none}
  .flow-list{grid-template-columns:minmax(0,1fr);gap:18px}
  .step{display:grid;grid-template-columns:84px minmax(0,1fr);gap:2px 16px;text-align:left;align-items:center;padding:18px}
  .step-ic{width:84px;height:84px;grid-row:span 2;margin:0}

  .step .n{margin-top:0}
  .step h3{font-size:1.04rem;margin-top:0}
  .price-card{padding:36px 18px 26px}
  .price-card .gift{width:64px;right:-6px;top:-30px}
  .ticket{grid-template-columns:minmax(0,1fr);text-align:center;gap:10px}
  .ticket .big{border-right:0;border-bottom:2px dashed rgba(27,18,56,.5);padding:0 0 10px}
  .faq summary{font-size:1rem;padding:16px}
  .faq details p{padding:0 16px 18px}
  .signup{padding-bottom:180px}
  .signup .skyline{height:150px}
  .form-card{padding:24px 18px}
  .sticky-cta{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(15,10,38,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12);transition:transform .35s}
  .sticky-cta .btn{width:100%;font-size:1.04rem;padding:.75em 1em}
  .sticky-cta.hide{transform:translateY(110%)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .nic svg{opacity:1!important}
  .js .rv,.js .flow .step,.js .seq,.js .map .pin,.js .map .pin-lab{opacity:1!important;transform:none!important;translate:none!important;clip-path:none!important}
  .js .draw .dl{stroke-dashoffset:0}
  .js .sec-head .hl::before{transform:skewX(-8deg)}
  .shoot{display:none}
}

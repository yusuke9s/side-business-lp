<html lang="ja">
<head>
<meta charset="utf-8">
<title>レシートまるごと申告 広告 1080x1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; }

/* ---- LP（public/receipt.html）と同じトークン ---- */
:root {
  --teal: #0e7490; --teal-d: #0b5a6e; --teal-dd: #062f3b; --teal-ddd: #041f27;
  --teal-l: #d5ecf0; --teal-ll: #ecf6f8; --bg: #f2f7f8; --paper: #fffef8;
  --amber: #f59f00; --amber-d: #b86e00; --amber-l: #ffe7a3; --amber-ll: #fff6dc;
  --ink: #10232b; --muted: #48606a; --line: #cfe2e7; --kraft: #c8925a;
  --fd: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  --fb: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --fm: "DotGothic16", "Courier New", monospace;
}
*, *::before, *::after { box-sizing: border-box; }
body { font-family: var(--fb); color: var(--ink); line-height: 1.8; }
img, svg { display: block; }
h1, p, ul { margin: 0; } ul { padding: 0; list-style: none; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.ad { position: relative; overflow: hidden; color: #fff; }
.grid-dark { background-color: var(--teal-dd); background-image: linear-gradient(rgba(255,255,255,.075) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.075) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px; }
.hero-bg { position: absolute; inset: 0; pointer-events: none; }
.hero-bg .glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(14,116,144,.75), rgba(14,116,144,0)); }
.hero-bg .digits { position: absolute; font-family: var(--fm); line-height: 1; color: rgba(255,255,255,.045); white-space: nowrap; letter-spacing: .05em; }
.hero-bg .dim { position: absolute; height: 20px; border-left: 1px solid rgba(255,255,255,.25); border-right: 1px solid rgba(255,255,255,.25); }
.hero-bg .dim::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed rgba(255,255,255,.25); }
.hero-bg .dim span { position: absolute; left: 50%; top: -3px; transform: translateX(-50%); font: 13px var(--fm); color: rgba(255,255,255,.5); background: var(--teal-dd); padding: 0 8px; white-space: nowrap; }

/* ロゴ（LPのヘッダーと同じ白地） */
.logo-chip { display: inline-flex; align-items: center; gap: .45em; background: #fff; border-radius: .32em; padding: .32em .6em .32em .45em; font: 700 1em/1.1 var(--fd); color: var(--teal-dd); white-space: nowrap; box-shadow: 0 .2em 0 rgba(0,0,0,.18); }
.logo-chip svg { width: 1.15em; height: 1.3em; flex: none; }
.logo-chip small { display: block; font: 400 .36em/1 var(--fm); letter-spacing: .2em; color: var(--teal); margin-top: .35em; }
/* バッジ（LPのヘッダーと同じ） */
.badge { display: inline-flex; align-items: center; gap: .5em; font: 700 1em/1 var(--fd); color: var(--teal-dd); background: var(--amber-l); padding: .5em .8em; border-radius: 999px; white-space: nowrap; }
.badge i { width: .5em; height: .5em; border-radius: 50%; background: #e03131; box-shadow: 0 0 0 .3em rgba(224,49,49,.22); }

/* 見出し（LPのh1と同じ処理） */
.copy { font: 700 1em/1.32 var(--fd); letter-spacing: .01em; color: #fff; text-shadow: 0 .04em 0 rgba(0,0,0,.15); }
.copy .ln { display: block; white-space: nowrap; }
.copy em { font-style: normal; color: var(--ink); background: var(--amber); padding: 0 .14em; margin-right: .06em; display: inline-block; transform: rotate(-1.5deg); box-shadow: .07em .07em 0 rgba(0,0,0,.25); text-shadow: none; }
.sub { font: 700 1em/1.4 var(--fd); color: #d3ecf1; display: flex; align-items: center; gap: .5em; white-space: nowrap; }
.sub b { font: 400 .62em/1 var(--fm); color: #fff; background: var(--teal); padding: .4em .55em; border-radius: .2em; letter-spacing: .08em; }

/* ボタン（LPの .btn-amber） */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: .55em; font: 700 1em/1.2 var(--fd); padding: .62em 1.1em .62em 1.25em; border-radius: 999px; background: var(--amber); color: var(--ink); box-shadow: 0 .16em 0 var(--amber-d), 0 .4em .8em rgba(245,159,0,.35); white-space: nowrap; }
.cta .arr { display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 50%; background: var(--ink); color: var(--amber); font-size: .8em; }

/* ステージ（LPのヒーローの絵） */
.scene { position: absolute; }
.scene .stage-svg { width: 100%; height: auto; overflow: visible; }
.obj { position: absolute; height: auto; filter: drop-shadow(0 14px 14px rgba(0,0,0,.28)); overflow: visible; }

/* 読み取り結果カード（LPのMOCK_RECEIPTと同じ） */
.zzb { --t: 14px; -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / var(--t) 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / var(--t) 100%; }
.shadow { filter: drop-shadow(0 12px 18px rgba(6,47,59,.3)); }
.result { position: absolute; }
.mock-list { background: var(--paper); color: var(--ink); border-radius: 4px; padding: 22px 18px 26px; position: relative; }
.mock-list::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: repeating-linear-gradient(90deg, var(--teal) 0 12px, transparent 12px 18px); opacity: .6; }
.list-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--line); padding-bottom: 10px; margin-bottom: 4px; }
.list-head b { font: 700 15px/1.2 var(--fd); color: var(--teal-dd); }
.list-head span { font: 700 11px/1 var(--fd); background: var(--teal-dd); color: #fff; padding: 5px 8px; border-radius: 3px; }
.rows li { display: grid; grid-template-columns: 44px 1fr auto; column-gap: 8px; align-items: baseline; padding: 9px 4px 9px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.5; position: relative; }
.rows li.hl { background: linear-gradient(90deg, transparent, rgba(245,159,0,.16), transparent); }
.rows .d { font-family: var(--fm); color: var(--teal); }
.rows .s { font-weight: 700; }
.rows .a { font-family: var(--fm); font-size: 15px; }
.rows .k { grid-column: 2 / 4; justify-self: start; margin-top: 4px; font-size: 11.5px; font-weight: 700; color: var(--amber-d); background: var(--amber-ll); border: 1px solid #f5d38a; padding: 1px 8px; border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chips span { font: 700 11.5px/1 var(--fd); color: var(--teal-dd); border: 1.5px solid var(--teal); border-radius: 999px; padding: 6px 10px; background: #fff; }
.mock-note { font-size: 10.5px; line-height: 1.5; color: var(--muted); margin-top: 10px; }

/* 勘定科目のベルト（LPの .belt-a） */
.belt { position: absolute; display: flex; white-space: nowrap; overflow: hidden; background: var(--amber); color: var(--ink); box-shadow: 0 10px 0 rgba(0,0,0,.18); }
.belt span { display: inline-flex; align-items: center; font: 700 1em/1 var(--fd); padding: .7em 0; }
.belt span i { display: inline-block; width: .42em; height: .42em; background: var(--ink); margin: 0 .9em; transform: rotate(45deg); }
.belt small { font: 700 .5em/1 var(--fd); background: var(--ink); color: var(--amber); padding: .45em .6em; border-radius: 3px; margin: 0 1.6em 0 1em; }
.belt-paper { position: absolute; display: flex; white-space: nowrap; overflow: hidden; background: var(--paper); color: var(--teal-dd); --t: 14px; -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--t) 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--t) 51% repeat-x; mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--t) 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--t) 51% repeat-x; }
.belt-paper span { font: 1em/1 var(--fm); padding: .85em 0; letter-spacing: .08em; }
.belt-paper span i { font-style: normal; color: var(--amber-d); margin: 0 1.1em; }

.ad { width: 1080px; height: 1080px; }
.glow { width: 900px; height: 900px; right: -200px; bottom: -260px; }
.digits { font-size: 150px; left: -10px; bottom: 300px; }
.dim { left: 620px; top: 470px; width: 380px; }
.topbar { position: absolute; left: 60px; right: 60px; top: 54px; display: flex; justify-content: space-between; align-items: center; }
.topbar .logo-chip { font-size: 34px; }
.topbar .badge { font-size: 28px; }
.copy { position: absolute; left: 60px; top: 176px; font-size: 98px; }
.sub { position: absolute; left: 62px; top: 448px; font-size: 34px; }
.scene { left: -6px; top: 520px; width: 560px; }
.result { left: 556px; top: 548px; width: 290px; zoom: 1.6; transform: rotate(1.5deg); }
.f-receipt { width: 150px; right: 54px; top: 300px; transform: rotate(10deg); }
.cta { position: absolute; right: 56px; bottom: 50px; font-size: 44px; }

</style>
</head>

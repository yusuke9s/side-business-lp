<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>pet-square (1080x1080)</title>
<!-- 広告クリエイティブ 1080x1080。CSS・SVGは public/pet.html からそのまま流用。文言はこのファイルの本文で直して撮り直す -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Yomogi&display=swap">
<style>
/* ===== LP (public/pet.html) のスタイルをそのまま ===== */

:root{
  --mint:#1f7a62; --mint-d:#145c4a; --mint-dd:#0d4437; --mint-l:#dcf1e8; --mint-ll:#eff8f4;
  --sun:#ffd23f; --sun-l:#ffe88f; --sun-d:#f2a541; --coral:#ff8b73; --sky:#8ed2ee;
  --ink:#1c2b26; --muted:#4a5a54; --cream:#fffcf2; --line:#1c2b26;
  --f-disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-hand:"Yomogi","Zen Maru Gothic",cursive;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:var(--cream);line-height:1.8;overflow-x:clip;
  background-image:radial-gradient(rgba(31,122,98,.09) 1.2px,transparent 1.4px);background-size:22px 22px}
img,svg{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--f-disp);line-height:1.35;margin:0;font-weight:900;word-break:auto-phrase}
p{margin:0}
.wrap{width:min(1160px,100% - 32px);margin-inline:auto}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.6em;justify-content:center;font-family:var(--f-disp);font-weight:900;font-size:1.12rem;
  text-decoration:none;color:#fff;background:var(--mint);border:3px solid var(--ink);border-radius:999px;padding:.85em 1.7em;
  box-shadow:5px 5px 0 var(--ink);transition:transform .2s,box-shadow .2s,background .2s;position:relative}
.btn svg{width:1.1em;height:1.1em;transition:transform .25s}
.btn:hover{transform:translate(-2px,-3px);box-shadow:8px 8px 0 var(--ink);background:var(--mint-d)}
.btn:hover svg{transform:translateX(4px)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun-d);outline-offset:3px}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,252,242,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--ink)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--f-disp);font-weight:900;font-size:1.22rem;color:var(--ink);white-space:nowrap}
.logo svg{width:38px;height:38px;flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:#e2483a;animation:blink 1.4s ease-in-out infinite}
.topbar .btn{margin-left:auto;font-size:.92rem;padding:.5em 1.2em;box-shadow:3px 3px 0 var(--ink)}
@keyframes blink{50%{opacity:.25}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--mint-l);border-bottom:3px solid var(--ink);padding:48px 0 84px}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);grid-template-areas:"head stage" "body stage";column-gap:40px;align-items:center}
.hero-head{grid-area:head;align-self:end}
.hero-body{grid-area:body;align-self:start}
.hero-stage{grid-area:stage}
.eyebrow{display:inline-block;font-family:var(--f-disp);font-weight:700;font-size:1rem;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 14px;position:relative;margin-bottom:18px;rotate:-2deg}
.eyebrow::after{content:"";position:absolute;left:26px;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.hero h1{font-size:clamp(2.1rem,4vw,3.15rem);letter-spacing:.01em;isolation:isolate}
.hero h1 .ln{display:block;white-space:nowrap}
.mk{position:relative;z-index:0;display:inline-block}
.mk::before{content:"";position:absolute;left:-.1em;right:-.1em;bottom:.06em;height:.46em;background:var(--sun);border-radius:.25em .6em .35em .7em;z-index:-1;transform:skewX(-10deg) rotate(-2deg);transform-origin:left center}
.mk.mk2::before{background:#9fe2c7}
.js .mk::before{transform:skewX(-10deg) rotate(-2deg) scaleX(0);animation:mk .7s cubic-bezier(.6,.1,.2,1) forwards;animation-delay:var(--md,1s)}
@keyframes mk{to{transform:skewX(-10deg) rotate(-2deg) scaleX(1)}}
.sub{font-size:1.04rem;color:var(--muted);margin-top:22px;max-width:34em}
.hero-points{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:22px 0 0}
.hero-points li{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:.88rem;font-weight:500;line-height:1.4}
.hero-points b{font-family:var(--f-disp);color:var(--mint);font-size:1.15rem;margin-right:4px}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-top:28px}
.cta-note{font-size:.84rem;color:var(--muted)}
.ai-note{font-size:.8rem;color:var(--muted);margin-top:10px}

/* stage collage */
.hero-stage{position:relative;width:100%;max-width:620px;aspect-ratio:1/1;margin-inline:auto}
.hero-stage>*{position:absolute}
.spl{fill:currentColor}
.spl1{color:var(--sun);width:46%;left:24%;top:4%;opacity:.9}
.spl2{color:var(--coral);width:22%;left:-2%;top:42%;opacity:.75}
.spl3{color:var(--sky);width:26%;right:-3%;top:44%;opacity:.8}
.pol{margin:0;background:#fff;padding:5.5% 5.5% 0;border-radius:4px;box-shadow:0 14px 28px rgba(18,52,42,.22),0 2px 0 rgba(0,0,0,.06)}
.pol figcaption{font-family:var(--f-hand);font-size:clamp(.9rem,1.6vw,1.2rem);text-align:center;padding:.35em 0 .55em;color:#3a3a3a}
.ph{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:2px}
.ph-a{background:radial-gradient(circle at 28% 22%,#fff6df 0,#f2dcb8 45%,#cfae84 100%)}
.ph-a::after,.ph-b .lay-photo::after,.ph-c::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 55%,rgba(40,25,10,.22));pointer-events:none}
.ph-c{background:radial-gradient(circle at 70% 25%,#fff 0,#f6dfe6 45%,#d9b3bf 100%)}
.ph-b .lay-photo{position:absolute;inset:0;background:linear-gradient(180deg,#d6e6ef 0 62%,#b99d7d 62% 100%)}
.ph-b .lay-photo .photo{filter:saturate(.92)}
.tape{position:absolute;z-index:2;width:34%;height:12%;left:33%;top:-5%;background:rgba(255,226,120,.78);rotate:-4deg;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tape.t2{background:rgba(158,226,199,.85);rotate:5deg}
.pol-dog{width:35%;left:1%;top:5%;rotate:-9deg;z-index:2}
.pol-rab{width:31%;left:3%;top:57%;rotate:7deg;z-index:2}
.pol-main{width:50%;left:27%;top:13%;rotate:3deg;z-index:3}
.pol-main figcaption{font-size:clamp(1rem,1.9vw,1.4rem)}
.lay-ill{position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,#ffbf3a 0 14%,transparent 15%),radial-gradient(circle at 85% 20%,#fff1a6 0 12%,transparent 13%),#ffd75e;
  clip-path:polygon(0 0,62% 0,44% 100%,0 100%)}
.lay-ill svg{position:absolute;width:88%;left:6%;bottom:0}
.brush{position:absolute;width:40%;height:auto;left:46%;top:42%;transform:translate(-30%,-62%) rotate(18deg);filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));z-index:3;pointer-events:none}
.ai-chip{position:absolute;right:6%;top:6%;z-index:4;background:var(--ink);color:#fff;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.acsta-wrap{width:30%;right:1%;top:50%;z-index:4;perspective:700px}
.acsta{position:relative;transform-style:preserve-3d}
.acsta .plate{position:relative}
.acsta .plate.back{position:absolute;inset:0;transform:translateZ(-6px);opacity:.45;filter:saturate(.4) brightness(1.2)}
.acsta .plate svg{width:100%;height:auto;overflow:visible}
.acsta-base{width:86%;height:18px;margin:-6px auto 0;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(206,233,225,.9));border:2px solid rgba(28,43,38,.35);border-radius:50%;box-shadow:0 10px 14px rgba(18,52,42,.25)}
.acsta-label{position:static!important;display:block;text-align:center;font-family:var(--f-hand);font-size:clamp(.9rem,1.6vw,1.15rem);margin-top:8px;color:var(--mint-d);rotate:-4deg}
.hand-arrow{width:24%;left:58%;top:-1%;z-index:4;overflow:visible}
.hand-arrow path{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hand-note{left:75%;top:1%;z-index:4;font-family:var(--f-hand);font-size:clamp(.9rem,1.7vw,1.2rem);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 8px;rotate:6deg;white-space:nowrap}
.flo{z-index:5;filter:drop-shadow(0 10px 12px rgba(0,0,0,.18))}
.flo-pal{width:19%;left:-3%;top:-4%;height:auto}
.flo-brush2{width:13%;right:4%;bottom:2%;height:auto}
.spark{fill:#fff;z-index:6;filter:drop-shadow(0 0 6px rgba(255,210,63,.9))}
.sp1{width:6%;left:22%;top:4%}.sp2{width:4.5%;left:80%;top:44%;fill:var(--sun)}.sp3{width:5%;left:36%;top:88%}.sp4{width:3.5%;left:12%;top:50%;fill:var(--sun)}.sp5{width:4%;right:2%;top:24%}
.ex-tag{left:44%;bottom:6%;z-index:6;font-size:.72rem;font-weight:700;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:1px 8px}

/* ---------- icon frames: paint splash + hand-drawn ring ---------- */
.pic{display:inline-block;flex:none;line-height:0;position:relative}
.pic svg{width:100%;height:100%;overflow:visible}
.f-b{fill:var(--pc,var(--sun));transform-origin:50% 50%;transform:rotate(var(--pr,0deg));transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.f-r{fill:none;stroke:var(--ring,var(--ink));stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.f-i{fill:var(--pi,var(--mint-dd))}
.f-p{fill:var(--ring,var(--ink));opacity:.8}
.f-t{fill:none;stroke:var(--ring,var(--ink));stroke-width:3;stroke-linecap:round}
.js .f-r{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.6,.1,.3,1) .35s}
.js .in .f-r{stroke-dashoffset:0}
.fcard:hover .f-b,.gcard:hover .f-b{transform:rotate(calc(var(--pr,0deg) + 24deg)) scale(1.08)}
/* pet "photos" */
.ph .photo{position:absolute;inset:0;width:100%;height:100%}
.js .ph .blink{transform-box:fill-box;transform-origin:center;animation:blinkE 5.5s ease-in-out infinite;animation-delay:var(--bk,0s)}
.js .ph .ear-tw{transform-box:fill-box;transform-origin:50% 100%;animation:earTw 4.6s ease-in-out infinite;animation-delay:var(--et,0s)}
@keyframes blinkE{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes earTw{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-7deg)}82%{transform:rotate(3deg)}88%{transform:rotate(-3deg)}}
.js .gift-hero .tstar{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.js .peek .blink{transform-box:fill-box;transform-origin:center;animation:blinkE 4.2s ease-in-out infinite}

/* hero motion (JS only) */
.js .ent{animation:entUp .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.js .pop{animation:pop .8s cubic-bezier(.3,1.5,.5,1) both,bob 6s ease-in-out infinite;animation-delay:var(--d,0s),calc(var(--d,0s) + 1s)}
.js .spl{animation:splat .7s cubic-bezier(.3,1.6,.5,1) both,bob 7s ease-in-out infinite;animation-delay:var(--d,0s),calc(var(--d,0s) + 1s)}
.js .spark{animation:pop .6s both,twinkle 2.4s ease-in-out infinite;animation-delay:var(--d,0s),calc(var(--d,0s) + .6s)}
.js .lay-ill{animation:wipe 8s 1.6s linear infinite both}
.js .brush{animation:brush 8s 1.6s linear infinite both}
.js .ai-chip{animation:chip 8s 1.6s linear infinite both}
.js .acsta{animation:spin 10s linear infinite}
@keyframes entUp{from{opacity:0;translate:0 30px}}
@keyframes pop{from{opacity:0;scale:.5;translate:0 30px}}
@keyframes splat{from{opacity:0;scale:.1}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes twinkle{50%{transform:scale(.4) rotate(45deg);opacity:.5}}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes wipe{
  0%,12%{clip-path:polygon(0 0,0 0,-20% 100%,0 100%);opacity:1}
  45%,84%{clip-path:polygon(0 0,125% 0,105% 100%,0 100%);opacity:1}
  94%,100%{clip-path:polygon(0 0,125% 0,105% 100%,0 100%);opacity:0}}
@keyframes brush{
  0%{left:-14%;top:30%;opacity:0} 9%{opacity:1} 12%{left:-8%;top:28%}
  20%{left:18%;top:70%} 28%{left:44%;top:30%} 36%{left:72%;top:72%} 45%{left:104%;top:36%;opacity:1}
  52%,100%{left:112%;top:30%;opacity:0}}
@keyframes chip{0%,44%{opacity:0;transform:translateY(6px)}48%,84%{opacity:1;transform:none}92%,100%{opacity:0}}

/* ---------- marquee ---------- */
.bands{position:relative;height:150px;overflow:hidden;margin-top:-34px;z-index:5}
.band{position:absolute;left:-5%;width:110%;overflow:hidden;border-block:3px solid var(--ink);white-space:nowrap}
.band-a{top:34px;background:var(--sun);rotate:-2.5deg;z-index:2}
.band-b{top:58px;background:var(--mint);color:#fff;rotate:2deg}
.band .track{display:inline-flex;gap:0;animation:marq 34s linear infinite;font-family:var(--f-disp);font-weight:900;font-size:1.5rem;padding:8px 0}
.band-b .track{animation-direction:reverse;animation-duration:40s;font-size:1.1rem}
.band .track span{display:inline-flex;align-items:center;gap:.7em;padding-right:.7em}
.band .track svg{width:1em;height:1em;fill:currentColor;opacity:.75}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- sections ---------- */
.sec{position:relative;padding:96px 0;overflow:hidden}
.sec-head{text-align:center;margin-bottom:52px}
.kicker{display:inline-block;font-family:var(--f-disp);font-weight:900;letter-spacing:.2em;font-size:.85rem;color:var(--mint);margin-bottom:8px}
.sec-title{font-size:clamp(1.7rem,3.4vw,2.6rem);position:relative;display:inline-block;padding:0 .3em}
.sec-title .stroke{position:absolute;left:-4%;width:108%;bottom:-.1em;height:.75em;z-index:-1;fill:var(--sun);overflow:visible}
.sec-head h2{isolation:isolate}
.sec-lead{color:var(--muted);margin-top:14px}

/* reveal */
.js .rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv.rv-l{transform:translateX(-50px) rotate(-3deg)}
.js .rv.rv-r{transform:translateX(50px) rotate(3deg)}
.js .rv.rv-wipe{transform:none;clip-path:inset(0 100% 0 0);transition:clip-path 1.1s cubic-bezier(.7,0,.2,1),opacity .3s;transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
.js .rv.rv-wipe.in{clip-path:inset(-10% -10% -10% -10%)}
.js .sec-title .stroke path{transform:scaleX(0);transform-origin:left;transition:transform .9s .3s cubic-bezier(.7,0,.2,1)}
.js .in .sec-title .stroke path,.js .sec-head.in .stroke path{transform:scaleX(1)}
.js .draw .dl{stroke-dasharray:1;stroke-dashoffset:1}
.js .draw.in .dl{stroke-dashoffset:0;transition:stroke-dashoffset 1.8s cubic-bezier(.6,.1,.3,1);transition-delay:var(--dd,.2s)}

/* ---------- pains ---------- */
.pains{background:#fff;border-bottom:3px solid var(--ink)}
.pains-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px;align-items:center}
.notes{display:grid;gap:22px;list-style:none;padding:0;margin:0}
.note{position:relative;display:flex;gap:16px;align-items:center;background:#fffbe3;border:2px solid var(--ink);border-radius:6px;padding:18px 20px 18px 18px;font-family:var(--f-hand);font-size:1.25rem;line-height:1.5;box-shadow:6px 6px 0 rgba(28,43,38,.12)}
.note:nth-child(1){rotate:-1.2deg}.note:nth-child(2){rotate:1deg;margin-left:28px;background:#eaf7f1}.note:nth-child(3){rotate:-.6deg;background:#fff0ea}
.note .pic{width:62px;height:62px}
.note::before{content:"";position:absolute;top:-10px;left:40%;width:70px;height:18px;background:rgba(255,210,63,.7);rotate:-3deg}
.pains-ill{position:relative;color:var(--mint)}
.pains-ill .ud{width:100%;height:auto}
.thought{position:absolute;right:4%;top:-8%;background:#fff;border:2px solid var(--ink);border-radius:50%;width:84px;height:84px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:2rem;color:var(--mint)}
.js .thought{animation:bob 4s ease-in-out infinite}
.so{text-align:center;margin-top:64px}
.so p{display:inline-block;font-family:var(--f-disp);font-weight:900;font-size:clamp(1.3rem,2.6vw,1.9rem);background:var(--ink);color:#fff;padding:.35em 1.1em;rotate:-1.5deg;box-shadow:6px 6px 0 var(--sun)}
.so p b{color:var(--sun)}

/* ---------- features + style gallery ---------- */
.feat{background:var(--mint-ll)}
.feat-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:start}
.gallery{position:relative;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:22px;box-shadow:10px 10px 0 var(--mint)}
.gal-frame{position:relative;background:#c99a63;padding:16px;border-radius:6px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15),0 14px 24px rgba(0,0,0,.18)}
.gal-mat{background:#fff;padding:18px}
.gal-art{position:relative;aspect-ratio:1/1;overflow:hidden;--bgc:#ffd75e}
.gal-art svg{width:100%;height:100%}
.gal-art .bgr{fill:var(--bgc);transition:fill .5s}
.gal-art .deco{opacity:0;transition:opacity .5s}
.gal-art[data-style="pop"]{--bgc:#ffd75e}
.gal-art[data-style="wc"]{--bgc:#fbf4e6;--fur:#f8c88a;--line:#c58d5c;--stripe:#eaa66a;--white:#fffaf0}
.gal-art[data-style="yuru"]{--bgc:#e4f4fd;--fur:#ffe6c4;--line:#7a5c4c;--stripe:#f2c79b;--cheek:#ff9db4;--collar:#7cc6e8}
.gal-art[data-style="wa"]{--bgc:#f3ece0;--fur:#f4ead8;--line:#1f2f55;--stripe:#c8452f;--collar:#c8452f;--bell:#e6b422;--cheek:#e77b6b}
.gal-art[data-style="pop"] .d-pop,.gal-art[data-style="wc"] .d-wc,.gal-art[data-style="yuru"] .d-yuru,.gal-art[data-style="wa"] .d-wa{opacity:1}
.gal-art[data-style="wc"] .pet{filter:url(#wc)}
.gal-art .pet{transition:transform .5s}
.gal-art.swap .pet{transform:scale(.94)}
.sty-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:center}
.sty-tabs button{font:inherit;font-family:var(--f-disp);font-weight:700;font-size:.95rem;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:4px 16px;cursor:pointer;transition:background .2s,transform .2s}
.sty-tabs button:hover{transform:translateY(-2px)}
.sty-tabs button[aria-pressed="true"]{background:var(--sun)}
.gal-cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:.82rem;color:var(--muted)}
.gal-cap b{font-family:var(--f-disp);font-size:1.05rem;color:var(--ink)}
.gal-pal{position:absolute;width:96px;height:auto;right:-26px;top:-38px;rotate:12deg;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.js .gal-pal{animation:bob 5s ease-in-out infinite}
.fcards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.fcard{position:relative;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:20px 18px 20px;transition:transform .25s,box-shadow .25s;box-shadow:0 0 0 rgba(0,0,0,0)}
.fcard:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:6px 8px 0 var(--sun)}
.fcard .pic{width:62px;height:62px}
.fcard .no{position:absolute;right:14px;top:10px;font-family:var(--f-disp);font-weight:900;color:var(--mint-l);font-size:2.4rem;line-height:1;-webkit-text-stroke:1.5px var(--mint)}
.fcard h3{font-size:1.12rem;margin:10px 0 6px}
.fcard p{font-size:.9rem;color:var(--muted);line-height:1.7}
.fcard .big{display:block;font-family:var(--f-disp);font-weight:900;font-size:1.9rem;color:var(--mint);line-height:1.2;margin-top:6px}
.fcard .big small{font-size:.9rem;margin-left:2px}
.fcard.wide{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.fcard.wide .pic{grid-row:span 2}

/* ---------- steps ---------- */
.steps{background:#fff;border-block:3px solid var(--ink)}
.flow{position:relative}
.flow-path{position:absolute;left:0;top:0;width:100%;height:190px;overflow:visible}
.flow-path .dots{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 15}
.flow-list{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;list-style:none;padding:0;margin:0;counter-reset:st}
.step{text-align:center;position:relative}
.step-ic{position:relative;width:190px;height:190px;margin:0 auto;display:grid;place-items:center;--pc:#9fe2c7;--pr:-6deg}
.step:nth-child(2) .step-ic{--pc:var(--sun);--pr:40deg}
.step:nth-child(3) .step-ic{--pc:#ffb3a3;--pr:-50deg}
.step-ic .st-art{width:100%;height:100%;overflow:visible}
.step-ic .sb{fill:var(--pc);transform-origin:50% 50%;transform:rotate(var(--pr))}
.step-ic .sb-sh{fill:var(--ink);opacity:.13;transform-origin:50% 50%;transform:translate(3px,5px) rotate(var(--pr))}
.step-ic .sub-ic{position:absolute;width:40%;right:-6%;bottom:2%;rotate:12deg;line-height:0}
.step-ic .sub-ic svg{width:100%;height:auto;overflow:visible}
.sub-bg{fill:#fff;stroke:var(--ink);stroke-width:4}
.sub-dash{fill:none;stroke:var(--mint);stroke-width:2.4;stroke-dasharray:4 5;opacity:.7}
.js .step-ic .st-art,.js .step-ic .sub-ic{animation:bob 4.5s ease-in-out infinite;animation-delay:var(--b,0s)}
.js .step-ic .sub-ic{animation-delay:calc(var(--b,0s) - .8s)}
.free-stamp{position:absolute;left:-10px;top:8px;width:66px;height:66px;border-radius:50%;background:#e2483a;color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:1.05rem;border:3px dashed #fff;outline:3px solid #e2483a;rotate:-14deg}
.st-no{display:inline-block;margin-top:26px;font-family:var(--f-disp);font-weight:900;font-size:.95rem;letter-spacing:.12em;background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px}
.st-no b{font-size:1.25rem;color:var(--sun);margin-left:4px}
.step h3{font-size:1.18rem;margin-top:12px}
.step p{font-size:.9rem;color:var(--muted);margin-top:6px}
.js .flow .step{opacity:0;transform:translateY(30px) scale(.9);transition:opacity .6s,transform .7s cubic-bezier(.3,1.5,.5,1)}
.js .flow.in .step{opacity:1;transform:none}
.js .flow.in .step:nth-child(1){transition-delay:.2s}.js .flow.in .step:nth-child(2){transition-delay:1s}.js .flow.in .step:nth-child(3){transition-delay:1.8s}
.ex-note{display:block;text-align:center;font-size:.8rem;color:var(--muted);margin-top:30px}

/* ---------- lineup ---------- */
.lineup{background:linear-gradient(180deg,#f6f1e4 0 70%,#efe6d2 70%);}
.lineup::before{content:"";position:absolute;left:0;right:0;top:250px;height:6px;background:#c99a63;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.prods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;position:relative}
.prod{background:#fff;border:3px solid var(--ink);border-radius:22px;overflow:hidden;transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;box-shadow:0 0 0 var(--ink)}
.prod:hover{transform:translateY(-10px) rotate(-1.5deg);box-shadow:8px 10px 0 var(--ink)}
.prod:nth-child(2):hover{transform:translateY(-10px) rotate(1.5deg)}
.prod-vis{position:relative;aspect-ratio:4/4.2;display:grid;place-items:center;background:var(--mint-l);border-bottom:3px solid var(--ink);overflow:hidden}
.prod:nth-child(2) .prod-vis{background:var(--sun-l)}
.prod:nth-child(3) .prod-vis{background:#ffe1d8}
.prod-vis svg.mock{width:78%;height:auto;transition:transform .5s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 16px 16px rgba(0,0,0,.18))}
.prod:hover .prod-vis svg.mock{transform:scale(1.06) rotate(-3deg)}
.prod-vis .tag{position:absolute;left:12px;top:12px;font-size:.72rem;font-weight:700;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:0 8px}
.prod-body{padding:20px 22px 24px}
.prod-body h3{font-size:1.25rem}
.prod-body p{font-size:.9rem;color:var(--muted);margin-top:6px}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:2px dashed #c9d6d1;margin-top:16px;padding-top:14px;flex-wrap:wrap}
.price>span{font-size:.84rem;font-weight:700}
.price b{font-family:var(--f-disp);font-size:1.9rem;color:var(--mint);line-height:1}
.price b small{font-size:.9rem;color:var(--ink);margin-left:2px}
.price .tbd{font-size:.9rem;color:var(--muted);font-weight:500}
.price-note{text-align:center;margin-top:24px;font-size:.9rem;color:var(--muted)}
.coupon{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;max-width:820px;margin:40px auto 0;background:var(--sun);border:3px solid var(--ink);border-radius:18px;padding:22px 28px;box-shadow:8px 8px 0 var(--ink)}
.coupon::before,.coupon::after{content:"";position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;background:#efe6d2;border:3px solid var(--ink);border-radius:50%}
.coupon::before{left:-17px;clip-path:inset(0 0 0 50%)}.coupon::after{right:-17px;clip-path:inset(0 50% 0 0)}
.coupon .lbl{font-family:var(--f-disp);font-weight:900;font-size:1rem;line-height:1.3;border-right:3px dashed var(--ink);padding-right:22px;text-align:center}
.coupon .lbl b{display:block;font-size:1.6rem}
.coupon p{font-weight:700}
.coupon .pic{width:70px;height:70px}
.js .coupon .pic{animation:bob 3.5s ease-in-out infinite}

/* ---------- gift season ---------- */
.gift{background:radial-gradient(ellipse at 50% 0,#17705a 0,#0d4437 60%,#0a3a2f 100%);color:#fff;padding-bottom:150px}
.gift .kicker{color:var(--sun)}
.gift .sec-title .stroke{fill:#1f7a62}
.gift .sec-lead{color:#d4ece3}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flake{position:absolute;top:-12px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx,20px),110vh)}}
.gift-hero{position:relative;display:flex;justify-content:center;gap:10px;margin:-10px 0 36px}
.gift-hero .gobj{width:120px;height:auto;overflow:visible;filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.gift-hero .gobj:nth-child(2){width:150px;margin-top:-20px}
.js .gift-hero .gobj{animation:bob 5s ease-in-out infinite}
.js .gift-hero .gobj:nth-child(2){animation-delay:-1.6s}.js .gift-hero .gobj:nth-child(3){animation-delay:-3s}
.gcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;position:relative;z-index:2}
.gcard{background:#fff;color:var(--ink);border-radius:20px;padding:26px 22px;border:3px solid var(--ink);box-shadow:0 10px 0 rgba(0,0,0,.25);transition:transform .25s}

.gcard .gc-top{display:flex;align-items:center;gap:12px}
.gcard .gc-top .pic{width:60px;height:60px}
.gcard h3{font-size:1.25rem}
.gcard p{font-size:.92rem;color:var(--muted);margin-top:10px}
.gnote{position:relative;z-index:2;display:flex;align-items:center;gap:14px;max-width:760px;margin:36px auto 0;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.5);border-radius:14px;padding:14px 20px;font-size:.95rem}
.gnote .pic{width:48px;height:48px;--ring:#fff;--pi:var(--mint-dd)}
.drift{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:1}
.drift svg{width:100%;height:100%}
.paws use{fill:#8fbfae}
.js .paws g>use{opacity:0;transform-box:fill-box;transform-origin:center;animation:paw 7s ease-in-out infinite;animation-delay:calc(var(--i) * .38s)}
@keyframes paw{0%{opacity:0;transform:scale(.4)}6%{opacity:1;transform:scale(1)}55%{opacity:1}75%,100%{opacity:0}}

/* ---------- faq ---------- */
.faq{background:var(--cream)}
.faq-list{max-width:820px;margin:0 auto;display:grid;gap:14px}
.faq details{background:#fff;border:2px solid var(--ink);border-radius:16px;overflow:hidden;transition:box-shadow .2s}
.faq details[open]{box-shadow:6px 6px 0 var(--mint)}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 20px;font-family:var(--f-disp);font-weight:700;font-size:1.08rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary .q{flex:none;width:34px;height:34px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-weight:900}
.faq summary .pm{margin-left:auto;flex:none;width:22px;height:22px;position:relative}
.faq summary .pm::before,.faq summary .pm::after{content:"";position:absolute;left:0;top:10px;width:22px;height:3px;background:var(--ink);border-radius:2px;transition:transform .3s}
.faq summary .pm::after{transform:rotate(90deg)}
.faq details[open] .pm::after{transform:rotate(0)}
.faq details p{padding:0 20px 20px 68px;color:var(--muted)}

/* ---------- signup ---------- */
.signup{background:var(--sun);border-top:3px solid var(--ink);padding-top:120px}
.drip{position:absolute;left:0;right:0;top:-2px;height:70px;width:100%}
.signup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;align-items:center}
.signup .sec-title .stroke{fill:#fff}
.signup .lead{margin-top:16px;font-weight:500}
.signup-vis{position:relative;margin-top:28px;color:var(--mint)}
.signup-vis .ud{width:88%;height:auto}
.signup-vis .peek{position:absolute;width:118px;height:auto;right:4%;top:-12%;overflow:visible}

.signup-vis .ex-mini{position:absolute;left:0;bottom:0;font-size:.72rem;font-weight:700;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:0 8px}
.form-card{position:relative;background:#fff;border:3px solid var(--ink);border-radius:24px;padding:30px 28px;box-shadow:10px 10px 0 var(--ink)}
.form-card label{display:block;font-weight:700;font-size:.95rem;margin-bottom:16px}
.form-card input,.form-card select{display:block;width:100%;margin-top:6px;font:inherit;font-weight:400;font-size:1rem;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--mint-ll);color:var(--ink)}

.err{color:#b3261e;font-weight:700;font-size:.9rem;margin:0 0 10px}
.privacy{font-size:.8rem;color:var(--muted);margin-top:14px}
.thanks{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:34px 28px;box-shadow:10px 10px 0 var(--mint);text-align:center}
.thanks h3{font-size:1.4rem;color:var(--mint)}

.thanks small{display:block;margin-top:12px;color:var(--muted)}
.form-card .perk-mini{display:flex;gap:10px;align-items:center;background:var(--sun-l);border-radius:12px;padding:10px 12px;font-size:.86rem;font-weight:700;margin-bottom:18px}
.form-card .perk-mini .pic{width:40px;height:40px}

/* ---------- footer ---------- */
footer{background:var(--mint-dd);color:#e4f3ec;padding:40px 0 48px;font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}

.sticky-cta{display:none}

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>退去前チェックパック 広告 1080x1920</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Klee+One:wght@600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; }

/* ---- LP（public/taikyo.html）と同じトークン ---- */
:root {
  --leaf: #4d7c0f; --leaf-d: #3b600b; --leaf-dd: #233a08; --leaf-ddd: #172606;
  --leaf-l: #e3ecd5; --leaf-ll: #f0f5e8; --bg: #f5f7f2; --cream: #fbf6ec;
  --orange: #e67700; --orange-d: #a85600; --orange-l: #ffe3c2; --orange-ll: #fff4e6;
  --kraft: #c99a62; --kraft-d: #a8793f; --kraft-l: #e6cfa6; --kraft-ll: #f3e6cc;
  --ink: #1f2914; --muted: #535e47; --line: #d6dfc9; --plan: #2a3519;
  --fd: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --fb: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --fh: "Klee One", "Zen Kaku Gothic New", cursive;
}
*, *::before, *::after { box-sizing: border-box; }
body { font-family: var(--fb); color: var(--ink); line-height: 1.8; }
img, svg { display: block; }
h1, p, ul { margin: 0; } ul { padding: 0; list-style: none; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.ad { position: relative; overflow: hidden; }
.graph { background-color: var(--cream); background-image: linear-gradient(rgba(77,124,15,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(77,124,15,.12) 1px, transparent 1px), linear-gradient(rgba(77,124,15,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(77,124,15,.05) 1px, transparent 1px); background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px; }
.kraft-tex { background-color: var(--kraft-l); background-image: radial-gradient(rgba(120,80,30,.12) 1px, transparent 1.5px), radial-gradient(rgba(255,255,255,.25) 1px, transparent 1.5px); background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px; }
.hero-bg { position: absolute; inset: 0; pointer-events: none; }
.hero-bg .sun { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,227,194,.95), rgba(255,227,194,0)); }
.hero-bg .kr { position: absolute; transform: rotate(-8deg); opacity: .5; border-radius: 10px; }
.slope { position: absolute; left: 0; right: 0; bottom: 0; background: var(--leaf-dd); clip-path: polygon(0 70%, 100% 0, 100% 100%, 0 100%); }

/* ロゴ（LPのヘッダーと同じ） */
.logo-chip { display: inline-flex; align-items: center; gap: .45em; background: #fff; border: 2px solid var(--line); border-radius: .4em; padding: .34em .65em .34em .45em; font: 900 1em/1.1 var(--fd); color: var(--leaf-dd); white-space: nowrap; box-shadow: 0 .14em 0 rgba(35,58,8,.12); }
.logo-chip svg { width: 1.3em; height: 1.24em; flex: none; }
.logo-chip small { display: block; font: 600 .38em/1 var(--fh); color: var(--leaf); margin-top: .35em; }
.badge { display: inline-flex; align-items: center; gap: .5em; font: 700 1em/1 var(--fd); color: var(--leaf-dd); background: var(--leaf-l); padding: .5em .8em; border-radius: 999px; white-space: nowrap; }
.badge i { width: .5em; height: .5em; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 .3em rgba(230,119,0,.2); }

/* 見出し（LPのh1と同じ処理） */
.copy { font: 900 1em/1.34 var(--fd); color: var(--leaf-dd); letter-spacing: .01em; }
.copy .ln { display: block; white-space: nowrap; }
.copy .mark { background: linear-gradient(transparent 62%, var(--kraft-l) 62%); }
.copy em { font-style: normal; color: #fff; background: var(--orange); padding: 0 .16em; border-radius: .07em; display: inline-block; transform: rotate(-1.5deg); box-shadow: .1em .1em 0 var(--leaf-dd); }
.eyebrow { display: inline-flex; align-items: center; gap: .55em; font: 700 1em/1.4 var(--fd); color: #fff; background: var(--leaf-dd); padding: .45em 1em .45em .45em; border-radius: 999px; white-space: nowrap; }
.ey-ic { flex: none; width: 2.2em; height: 1.6em; display: grid; place-items: center; padding-left: .45em; color: var(--leaf-dd); background: var(--kraft-l); clip-path: polygon(.55em 0, 100% 0, 100% 100%, .55em 100%, 0 50%); border-radius: 0 .25em .25em 0; }
.ey-ic svg { width: 1.1em; height: 1.1em; }

/* ボタン（LPの .btn-or） */
.cta { display: inline-flex; align-items: center; justify-content: center; gap: .55em; font: 900 1em/1.2 var(--fd); padding: .62em 1.1em .62em 1.25em; border-radius: 999px; background: var(--orange); color: #fff; box-shadow: 0 .16em 0 var(--orange-d), 0 .4em .8em rgba(230,119,0,.3); text-shadow: 0 1px 0 rgba(0,0,0,.15); white-space: nowrap; }
.cta .arr { display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 50%; background: #fff; color: var(--orange); font-size: .8em; text-shadow: none; }

/* 間取りステージ（LPのヒーロー。600x560 を zoom で拡大） */
.stage-pos { position: absolute; }
.hero-stage { position: relative; width: 600px; aspect-ratio: 600 / 560; }
.plan-card { position: absolute; inset: 0; }
.plan-svg { width: 100%; height: auto; overflow: visible; }
.plan-svg text { font-family: var(--fd); }
.plan-svg .hand { font-family: var(--fh); }
.obj { position: absolute; height: auto; filter: drop-shadow(0 12px 12px rgba(35,58,8,.22)); overflow: visible; }
.f-key { width: 13%; left: -5%; top: 4%; transform: rotate(-5deg); }
.f-house { width: 14%; left: 38%; top: -10%; transform: rotate(-3deg); }
.f-cam { width: 14%; right: -4%; top: 2%; transform: rotate(5deg); }
.f-door { width: 12%; left: -7%; top: 52%; transform: rotate(-4deg); }
.f-broom { width: 13%; left: 18%; bottom: -8%; transform: rotate(-10deg); transform-origin: 50% 90%; }
.tip { position: absolute; z-index: 3; width: 178px; transform: translate(-50%, calc(-100% - 22px)); background: #fff; border: 2px solid var(--leaf-dd); border-radius: 10px; padding: 9px 12px 10px; box-shadow: 5px 5px 0 var(--orange); font-size: 12.5px; line-height: 1.5; }
.tip::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 18px; height: 18px; background: #fff; border-right: 2px solid var(--leaf-dd); border-bottom: 2px solid var(--leaf-dd); transform: translateX(-50%) rotate(45deg); }
.tip b { display: flex; align-items: center; gap: 6px; font: 900 14px/1.3 var(--fd); color: var(--leaf-dd); margin-bottom: 2px; }
.tip b i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 12px; display: grid; place-items: center; }
.tip span { font-family: var(--fh); color: var(--muted); }
.tip-wall { left: 84%; top: 26.8%; }
.tip-floor { left: 48%; top: 41%; }
.tip-water { left: 22%; top: 63.5%; }
.tip.mini { width: auto; padding: 7px 12px 7px 9px; }
.tip.mini b { margin: 0; font-size: 16px; }
.tip.mini span { display: none; }
.boxes { position: absolute; right: -3%; bottom: -5%; width: 30%; aspect-ratio: 1 / 1.05; z-index: 2; }
.box { position: absolute; border-radius: 4px; background: linear-gradient(135deg, #d9ad75, #c08c50 70%, #a8793f); box-shadow: inset 0 -6px 0 rgba(0,0,0,.08), 0 10px 18px rgba(35,58,8,.25); }
.box::before { content: ""; position: absolute; left: 50%; top: 0; width: 18%; height: 100%; transform: translateX(-50%); background: rgba(244,226,190,.55); border-left: 1px dashed rgba(120,80,30,.3); border-right: 1px dashed rgba(120,80,30,.3); }
.box::after { content: ""; position: absolute; left: 0; right: 0; top: 18%; border-top: 2px solid rgba(120,80,30,.25); }
.box span { position: absolute; left: 8%; bottom: 12%; font: 900 11px/1.2 var(--fd); color: #b02a1a; background: #fff8ea; border: 1.5px solid #b02a1a; padding: 3px 5px; border-radius: 2px; white-space: nowrap; transform: rotate(-3deg); }
.box.b1 { left: 0; bottom: 0; width: 100%; height: 46%; }
.box.b2 { left: 8%; bottom: 46%; width: 70%; height: 34%; }
.box.b2 span { color: var(--leaf-dd); border-color: var(--leaf-dd); }
.box.b3 { left: 28%; bottom: 80%; width: 44%; height: 24%; }
.box.b3 span { font-size: 10px; color: var(--ink); border-color: var(--ink); left: 12%; }

/* 養生テープ（LPの .tape-a / .tape-b） */
.tape { position: absolute; display: flex; white-space: nowrap; overflow: hidden; }
.tape-a { background: rgba(214,175,118,.97); color: #4a3214; box-shadow: 0 6px 12px rgba(0,0,0,.25); --t: 10px; -webkit-mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--t) 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--t) 51% repeat-x; mask: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / var(--t) 51% repeat-x, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / var(--t) 51% repeat-x; }
.tape-a span { display: inline-flex; align-items: center; font: 900 1em/1 var(--fd); padding: .8em 0; }
.tape-a span i { font-style: normal; display: inline-grid; place-items: center; width: 1.1em; height: 1.1em; border-radius: 50%; background: var(--leaf); color: #fff; font-size: .6em; margin: 0 .6em 0 1.6em; }
.tape-a span i svg { width: .7em; height: .7em; }
.tape-b { background: var(--orange); color: #fff; }
.tape-b span { font: 600 1em/1 var(--fh); padding: .75em 0; letter-spacing: .06em; }
.tape-b span i { font-style: normal; margin: 0 1.3em; opacity: .8; }

.ad { width: 1080px; height: 1920px; }
.sun { width: 1100px; height: 1100px; right: -360px; top: 600px; }
.kr { width: 560px; height: 380px; left: -140px; top: 300px; }
.slope { height: 560px; clip-path: polygon(0 34%, 100% 12%, 100% 100%, 0 100%); }
.topbar { position: absolute; left: 70px; right: 70px; top: 290px; display: flex; justify-content: space-between; align-items: center; }
.topbar .logo-chip { font-size: 38px; }
.topbar .badge { font-size: 30px; }
.copy { position: absolute; left: 70px; top: 420px; font-size: 118px; }
.sub { position: absolute; left: 72px; top: 762px; font-size: 34px; }
.stage-pos { left: 130px; top: 900px; }
.hero-stage { zoom: 1.38; }
.tape-a { left: -40px; right: -40px; top: 1468px; transform: rotate(-2.2deg); font-size: 30px; }
.ctawrap { position: absolute; left: 0; right: 0; top: 1556px; display: flex; justify-content: center; }
.cta { font-size: 54px; }

</style>
</head>

<head>

<meta name="viewport" content="width=1200, initial-scale=1">
<title>志望理由書コーチ 広告 landscape 1200x628</title>
<!-- 志望理由書コーチ（public/shibou.html）の広告クリエイティブ。文言を直したら Playwright でこの解像度ちょうどに撮り直す（deviceScaleFactor 1）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&family=Klee+One:wght@600&display=swap">
<style>
:root {
  --bd: #7a1f3d; --bd-deep: #5a1530; --bd-soft: #efdde3;
  --ink: #1b2340; --ink-2: #283158;
  --paper: #fbf8f2; --paper-2: #f2ebdf; --white: #ffffff;
  --red: #c42b40; --text: #1d2233; --muted: #4f566a;
  --gl: rgba(122, 31, 61, 0.26);
  --f-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-pen: "Klee One", "Shippori Mincho", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 1200px; height: 628px; overflow: hidden; }
body { background: var(--paper); color: var(--text); font-family: var(--f-body); }
p { margin: 0; }
.ad { position: relative; width: 1200px; height: 628px; overflow: hidden;
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse at 78% 70%, rgba(239,221,227,.75), transparent 55%),
    repeating-linear-gradient(90deg, transparent 0 calc(var(--g) - 1px), rgba(122,31,61,.10) calc(var(--g) - 1px) var(--g)),
    repeating-linear-gradient(0deg, transparent 0 calc(var(--g) - 1px), rgba(122,31,61,.10) calc(var(--g) - 1px) var(--g));
}
/* 原稿用紙の外枠（ノド）風の帯 */
.ad::after { content: ""; position: absolute; inset: var(--frame-in); border: 2px solid rgba(122,31,61,.22); pointer-events: none; }
.wm { position: absolute; font-family: var(--f-display); font-weight: 800; line-height: 1; color: rgba(122,31,61,.05); pointer-events: none; }

/* logo / badge */
.logo { position: absolute; display: inline-flex; align-items: center; gap: .32em; color: var(--ink); }
.logo svg { width: 1.9em; height: 1.9em; flex: none; }
.logo b { display: block; font-family: var(--f-display); font-weight: 800; letter-spacing: .04em; line-height: 1.1; }
.logo small { display: block; font-size: .36em; font-weight: 500; letter-spacing: .12em; color: var(--bd); line-height: 1.3; }
.badge { position: absolute; font-weight: 700; color: var(--white); background: var(--bd); border-radius: 6px; white-space: nowrap; line-height: 1; display: inline-flex; align-items: center; gap: .45em; box-shadow: 0 4px 0 var(--bd-deep); }
.badge::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: #ffd1db; }

/* headline */
h1 { position: absolute; margin: 0; font-family: var(--f-display); font-weight: 800; color: var(--ink); }
h1 .l1 { display: block; letter-spacing: .02em; line-height: 1.15; white-space: nowrap; }
h1 .l2 { display: inline-block; color: var(--white); background: var(--bd); line-height: 1.3; white-space: nowrap; clip-path: polygon(0 0, 100% 0, calc(100% - .28em) 100%, 0 100%); }
h1 .l2 em { font-style: normal; position: relative; }
h1 .l2 em svg { position: absolute; left: -14%; top: -20%; width: 128%; height: 140%; overflow: visible; }
h1 .l2 em path { fill: none; stroke: #ffd1db; stroke-width: 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sub { position: absolute; display: flex; align-items: center; gap: .5em; font-weight: 700; color: var(--bd); letter-spacing: .04em; white-space: nowrap; }
.sub::before { content: ""; width: 1.4em; height: 2px; background: var(--bd); }

/* CTA */
.cta { position: absolute; display: inline-flex; align-items: center; justify-content: center; gap: .5em; background: var(--bd); color: var(--white); font-weight: 700; letter-spacing: .04em; border-radius: 10px; white-space: nowrap; line-height: 1; box-shadow: 0 .2em 0 var(--bd-deep), 0 .5em 1em rgba(90,21,48,.28); overflow: hidden; }
.cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.22) 48%, transparent 66%); }
.cta .arr { font-weight: 700; }

/* paper (原稿用紙) */
.paper { position: absolute; background: #fffdf8; padding: calc(var(--cell) * .55) calc(var(--cell) * .6) calc(var(--cell) * .66); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 24px 50px rgba(27,35,64,.18), 0 6px 14px rgba(27,35,64,.08); transform: rotate(-2.2deg); z-index: 3; }
.paper::before, .paper::after { content: ""; position: absolute; width: calc(var(--cell) * 2.9); height: calc(var(--cell) * .8); background: rgba(239,221,227,.88); top: calc(var(--cell) * -.36); box-shadow: 0 2px 4px rgba(0,0,0,.06); }
.paper::before { left: calc(var(--cell) * .55); transform: rotate(-6deg); }
.paper::after { right: calc(var(--cell) * .55); transform: rotate(5deg); }
.paper-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: calc(var(--cell) * .3); color: var(--muted); }
.paper-head b { font-family: var(--f-display); color: var(--ink); font-size: calc(var(--cell) * .46); }
.tag-ex { font-size: calc(var(--cell) * .36); font-weight: 700; color: var(--bd); border: 1px solid var(--bd); border-radius: 3px; padding: 0 .5em; background: #fff; line-height: 1.5; }
.genko-wrap { position: relative; width: max-content; margin: 0 auto; }
.genko { display: grid; direction: rtl; grid-auto-flow: column; grid-template-rows: repeat(12, var(--cell)); grid-auto-columns: var(--cell); border-top: 1.5px solid var(--gl); border-right: 1.5px solid var(--gl); font-family: var(--f-display); font-weight: 600; color: var(--ink); }
.genko i { font-style: normal; writing-mode: vertical-rl; display: grid; place-items: center; position: relative; border-left: 1px solid var(--gl); border-bottom: 1px solid var(--gl); font-size: calc(var(--cell) * .58); line-height: 1; }
.genko i.t { font-weight: 800; color: var(--bd); }
.genko i s { text-decoration: none; position: absolute; bottom: -.55em; left: 50%; transform: translateX(-50%); }
.anno { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); overflow: visible; pointer-events: none; }
.anno path { fill: none; stroke: var(--red); stroke-width: calc(var(--cell) * .08); stroke-linecap: round; stroke-linejoin: round; }
.pen-note { position: absolute; left: calc(var(--cell) * .08); top: calc(var(--cell) * 3.6); writing-mode: vertical-rl; font-family: var(--f-pen); color: var(--red); font-size: calc(var(--cell) * .46); line-height: 1.2; letter-spacing: .08em; }

/* 問いの吹き出し */
.bubble { position: absolute; z-index: 5; background: var(--white); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 8px 8px 0 var(--ink); }
.bubble::before { content: ""; position: absolute; top: -17px; right: 22%; width: 28px; height: 28px; background: var(--white); border-left: 3px solid var(--ink); border-top: 3px solid var(--ink); transform: rotate(45deg) skew(8deg, 8deg); }
.bubble-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: .35em; }
.bubble-h b { font-family: var(--f-pen); color: var(--white); background: var(--red); font-size: .82em; padding: .05em .7em; border-radius: 4px; font-weight: 600; }
.bubble-h .tag-ex { font-size: .62em; }
.bubble p { line-height: 1.6; font-weight: 500; color: var(--ink); }

.stamp { position: absolute; z-index: 6; font-family: var(--f-pen); font-weight: 600; color: var(--red); border: 3px solid var(--red); background: rgba(255,255,255,.92); border-radius: 8px; padding: .1em .55em; white-space: nowrap; line-height: 1.4; }

.c-img { position: absolute; z-index: 2; filter: drop-shadow(0 16px 18px rgba(27,35,64,.22)); }
.c-img svg { display: block; width: 100%; height: 100%; overflow: visible; }
.pole { position: absolute; border-radius: 50%; background: var(--bd); opacity: .1; }
.squig { position: absolute; overflow: visible; }
.squig path { fill: none; stroke: var(--red); stroke-width: 3; stroke-linecap: round; opacity: .55; }

.ad { --g: 28px; --frame-in: 16px; }
.wm { font-size: 560px; right: -60px; top: 60px; }
.pole { width: 200px; height: 200px; left: 1010px; top: 300px; }
.squig { left: 600px; top: 520px; width: 0; height: 0; }
.logo { left: 48px; top: 40px; font-size: 28px; }
.badge { left: 384px; top: 50px; font-size: 20px; padding: 11px 16px; box-shadow: 0 3px 0 var(--bd-deep); }
h1 { left: 48px; top: 140px; }
h1 .l1 { font-size: 80px; }
h1 .l2 { margin-top: 16px; font-size: 52px; padding: 4px 30px 7px 16px; }
.sub { left: 50px; top: 360px; font-size: 24px; }
.c-bldg { left: 1040px; top: 24px; width: 140px; height: 140px; z-index: 1; }
.paper { --cell: 27px; left: 812px; top: 52px; }
.c-cap { left: 676px; top: 60px; width: 120px; height: 120px; z-index: 4; transform: rotate(-8deg); }
.c-books { left: 676px; top: 200px; width: 120px; height: 120px; }
.c-pen { left: 1080px; top: 440px; width: 110px; height: 110px; z-index: 6; }
.bubble { left: 640px; top: 400px; width: 340px; padding: 12px 16px 14px; font-size: 19px; border-width: 2.5px; box-shadow: 6px 6px 0 var(--ink); }
.bubble::before { right: 18%; top: -15px; width: 24px; height: 24px; border-width: 2.5px; }
.cta { left: 48px; top: 450px; font-size: 30px; padding: 22px 38px; border-radius: 8px; }
</style>
</head>
